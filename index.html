    } else {
      // First run — seed Firestore from data.js
      _memDB = JSON.parse(JSON.stringify({
        doctors:  SEED.doctors,
        branches: SEED.branches,
        leaves:   SEED.leaves   || [],
        audit:    SEED.audit    || [],
        settings: SEED.settings || {},
        _seq:     SEED._seq     || {doctors:200, branches:10, leaves:50, audit:100}
      }));
      await _docRef.set({ data: JSON.stringify(_memDB) });
    }

    // Real-time listener: update all devices when data changes
    _docRef.onSnapshot(snap => {
      if (!snap.exists || snap.metadata.hasPendingWrites) return;
      if (Date.now() - _lastWriteTs < 3000) return; // skip echo of our own writes
      const raw = snap.data();
      _memDB = raw.data ? JSON.parse(raw.data) : raw;
      document.dispatchEvent(new CustomEvent('adelcare:sync'));
    });
  }

  function ensureInit() {
    if (!_initPromise) _initPromise = _doInit();
    return _initPromise;
  }

  // ── البيانات في Firestore — أول تشغيل يُهيئها من data.js ────────

  function initDB() { return _memDB; }

  function nextId(db, table) {
    const id = db._seq[table] || 1;
    db._seq[table] = id + 1;
    return id;
  }

  function log(db, action, entity, entity_id, detail) {
    db.audit.unshift({
      id: nextId(db,'audit'),
      ts: new Date().toISOString().slice(0,19),
      user: "محرّر", action, entity, entity_id: entity_id||null, detail: detail||""
    });
    if (db.audit.length > 300) db.audit.length = 300;
  }

  // ── Helpers ──────────────────────────────────────────────────
  function fmtMin(m) {
    m = ((m % 1440) + 1440) % 1440;
    const h = Math.floor(m/60), mm = m%60;
    const suf = h < 12 ? "ص" : "م";
    return `${h%12||12}:${String(mm).padStart(2,"0")}${suf}`;
  }

  function normalizeAr(s) {
    return (s||"").trim()
      .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
      .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
  }

  function activeLeaveFn(leaves, doctorId, dateStr) {
    return leaves.find(l =>
      l.doctor_id == doctorId && l.start_date <= dateStr && l.end_date >= dateStr
    );
  }

  function computeStatus(doc, nowMin, day, dateStr, leaves) {
    if (doc.archived) return {state:"archived",label:"مؤرشف",color:"gray"};
    const lv = activeLeaveFn(leaves, doc.id, dateStr);
    if (lv || doc.status === "leave") {
      const leaveType = lv ? (lv.type||"إجازة") : "إجازة";
      const detail = lv ? `${leaveType} · حتى ${lv.end_date}` : "";
      return {state:"leave", label:"إجازة", color:"leave", leaveType, detail, leave: lv||null};
    }
    const sc = doc.schedule || {};
    // normalise shift: if end < start treat as overnight (end += 1440)
    const norm = ([s,e]) => e < s ? [s, e+1440] : [s, e];
    const todays = (sc[day] || sc[String(day)] || []).map(norm);
    const yest   = (sc[(day+6)%7] || sc[String((day+6)%7)] || []).map(norm);

    // still inside a shift that started today (before midnight portion)
    for (const [s,e] of todays) {
      if (s <= nowMin && nowMin < Math.min(e, 1440))
        return {state:"present",label:"موجود الآن",color:"green",detail:`حتى ${fmtMin(e%1440)}`,shift_end:e};
    }
    // inside overnight tail from yesterday's shift
    for (const [s,e] of yest) {
      if (e > 1440 && nowMin < e-1440)
        return {state:"present",label:"موجود الآن",color:"green",detail:`حتى ${fmtMin(e-1440)}`,shift_end:e-1440};
    }
    // upcoming shift today
    const starts = todays.filter(([s])=>s>nowMin).map(([s])=>s);
    if (starts.length) {
      const nx = Math.min(...starts);
      return {state:"upcoming",label:"يبدأ لاحقاً",color:"amber",detail:`يبدأ ${fmtMin(nx)}`,next_start:nx};
    }
    // had a shift today but it's done, or still has an overnight tail running past midnight
    if (todays.length) {
      const overnightRunning = todays.some(([s,e])=>e>1440);
      if (overnightRunning) {
        // after midnight: still inside overnight tail — covered above; reaching here means past the end
        return {state:"finished",label:"انتهى دوامه",color:"red",detail:"انتهى اليوم"};
      }
      return {state:"finished",label:"انتهى دوامه",color:"red",detail:"انتهى اليوم"};
    }
    return {state:"off",label:"إجازة أسبوعية",color:"black",detail:"يوم إجازة"};
  }

  function nowInfo() {
    const now = new Date();
    const day = now.getDay();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const pad = n => String(n).padStart(2,'0');
    const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    return {day, nowMin, dateStr};
  }

  function withStatus(doc, db) {
    const {day,nowMin,dateStr} = nowInfo();
    return { ...doc, live: computeStatus(doc, nowMin, day, dateStr, db.leaves) };
  }

  function getExtra(db) {
    try { return Array.isArray(db.settings.extra_specialties) ? db.settings.extra_specialties : JSON.parse(db.settings.extra_specialties||"[]"); }
    catch(e) { return []; }
  }
  function setExtra(db, arr) {
    db.settings.extra_specialties = arr;
  }
  function allSpecialties(db) {
    const s = new Set(db.doctors.filter(d=>!d.archived&&d.specialty).map(d=>d.specialty));
    getExtra(db).forEach(x=>s.add(x));
    return [...s].sort();
  }

  // ── Routing ──────────────────────────────────────────────────
  function route(method, path, body) {
    const db = initDB();
    const sess = getSession();

    const needAuth = () => { if (!sess.auth) throw Object.assign(new Error("auth"),{status:401}); };
    const needEdit = () => { needAuth(); if (!sess.edit) throw Object.assign(new Error("وضع التعديل مقفل"),{status:403}); };

    // AUTH
    if (method==="POST" && path==="/login") {
      const fk="login"; const fl=_fails[fk]||{count:0,until:0};
      if(fl.until>Date.now()) throw Object.assign(new Error(`حاول مرة أخرى بعد ${Math.ceil((fl.until-Date.now())/1000)} ثانية`),{status:429});
      const code = (body.code||"").trim();
      const ac = db.settings.access_code||"123";
      const ec = db.settings.edit_code||"1212";
      if (code===ec) { _fails[fk]={count:0,until:0}; setSession({auth:true,edit:true}); return getSession(); }
      if (code===ac) { _fails[fk]={count:0,until:0}; setSession({auth:true,edit:false}); return getSession(); }
      const nc=fl.count+1; _fails[fk]={count:nc,until:nc>=5?Date.now()+30000:0};
      throw Object.assign(new Error("رمز الدخول غير صحيح"),{status:401});
    }
    if (method==="POST" && path==="/logout") { setSession({auth:false,edit:false}); return {ok:true}; }
    if (method==="POST" && path==="/unlock") {
      needAuth();
      const fk="unlock"; const fl=_fails[fk]||{count:0,until:0};
      if(fl.until>Date.now()) throw Object.assign(new Error(`حاول مرة أخرى بعد ${Math.ceil((fl.until-Date.now())/1000)} ثانية`),{status:429});
      const code=(body.code||"").trim();
      if (code===( db.settings.edit_code||"1212")) { _fails[fk]={count:0,until:0}; setSession({...sess,edit:true}); return getSession(); }
      const nc=(fl.count||0)+1; _fails[fk]={count:nc,until:nc>=5?Date.now()+30000:0};
      throw Object.assign(new Error("رمز التعديل غير صحيح"),{status:403});
    }
    if (method==="POST" && path==="/lock") { needAuth(); setSession({...sess,edit:false}); return getSession(); }
    if (method==="GET"  && path==="/me") {
      if (sess.edit) setSession({...sess, edit:false});
      return {user: sess.auth ? {...sess, edit:false} : null};
    }
    if (method==="POST" && path==="/verify-admin") {
      needAuth();
      const fk="admin"; const fl=_fails[fk]||{count:0,until:0};
      if(fl.until>Date.now()) throw Object.assign(new Error(`حاول مرة أخرى بعد ${Math.ceil((fl.until-Date.now())/1000)} ثانية`),{status:429});
      const code=(body.code||"").trim();
      if (code===(db.settings.admin_code||"12345")) {
        _fails[fk]={count:0,until:0};
        setSession({...sess,edit:true});
        return {ok:true};
      }
      const nc=(fl.count||0)+1; _fails[fk]={count:nc,until:nc>=5?Date.now()+30000:0};
      throw Object.assign(new Error("رمز الإدارة غير صحيح"),{status:403});
    }

    // SETTINGS
    if (method==="GET" && path==="/settings") {
      needAuth();
      return {access_code:db.settings.access_code,edit_code:db.settings.edit_code,admin_code:db.settings.admin_code};
    }
    if (method==="PUT" && path==="/settings") {
      needAuth();
      ["access_code","edit_code","admin_code"].forEach(k=>{ if(body[k]&&body[k].trim()) db.settings[k]=body[k].trim(); });
      log(db,"تغيير رموز الأمان","settings");
      save(db); return {ok:true};
    }

    // SPECIALTIES
    if (method==="GET" && path==="/specialties") {
      needAuth();
      return {specialties:allSpecialties(db), extra:getExtra(db)};
    }
    if (method==="POST" && path==="/specialties") {
      needEdit();
      const name=(body.name||"").trim(); if(!name) throw new Error("اسم القسم مطلوب");
      const ex=getExtra(db); if(!ex.includes(name)){ ex.push(name); setExtra(db,ex); }
      log(db,"إضافة قسم","specialty",null,name); save(db);
      return {ok:true,specialties:allSpecialties(db),extra:getExtra(db)};
    }
    if (method==="DELETE" && path==="/specialties") {
      needEdit();
      const name=(body.name||"").trim();
      const ex=getExtra(db).filter(x=>x!==name); setExtra(db,ex);
      log(db,"حذف قسم","specialty",null,name); save(db);
      return {ok:true,specialties:allSpecialties(db),extra:getExtra(db)};
    }
    if (method==="PUT" && path==="/specialties") {
      needEdit();
      const o=(body.old||"").trim(), n=(body.new||"").trim();
      const ex=getExtra(db).map(x=>x===o?n:x); setExtra(db,ex);
      db.doctors.forEach(d=>{ if(d.specialty===o) d.specialty=n; });
      log(db,"تعديل قسم","specialty",null,`${o} → ${n}`); save(db);
      return {ok:true,specialties:allSpecialties(db),extra:getExtra(db)};
    }

    // BRANCHES
    if (method==="GET" && path==="/branches") {
      needAuth();
      const {day,nowMin,dateStr}=nowInfo();
      return {branches: db.branches.map(b=>{
        const docs=db.doctors.filter(d=>d.branch_id==b.id&&!d.archived);
        const present=docs.filter(d=>computeStatus(d,nowMin,day,dateStr,db.leaves).state==="present").length;
        return {...b,doctor_count:docs.length,present,specialties:[...new Set(docs.map(d=>d.specialty))].sort()};
      })};
    }
    const brM = path.match(/^\/branches\/(\d+)$/);
    if (brM) {
      const bid=+brM[1];
      if (method==="GET") {
        needAuth();
        const b=db.branches.find(x=>x.id===bid); if(!b) throw Object.assign(new Error("not found"),{status:404});
        const docs=db.doctors.filter(d=>d.branch_id===bid&&!d.archived).sort((a,b)=>a.name.localeCompare(b.name));
        return {branch:b,doctors:docs.map(d=>withStatus(d,db)),specialties:[...new Set(docs.map(d=>d.specialty))].sort()};
      }
      if (method==="PUT") {
        needEdit();
        const b=db.branches.find(x=>x.id===bid); if(!b) throw Object.assign(new Error("not found"),{status:404});
        ["name","grp","info","hours","phone","landline","bank_account","iban","extra_info"].forEach(k=>{ if(k in body) b[k]=body[k]; });
        log(db,"تعديل فرع","branch",bid,b.name); save(db); return {ok:true};
      }
      if (method==="DELETE") {
        needEdit();
        const n=db.doctors.filter(d=>d.branch_id===bid&&!d.archived).length;
        if(n) throw new Error(`لا يمكن حذف فرع يضم ${n} طبيب`);
        db.branches=db.branches.filter(x=>x.id!==bid);
        log(db,"حذف فرع","branch",bid,""); save(db); return {ok:true};
      }
    }
    if (method==="POST" && path==="/branches") {
      needEdit();
      const id=nextId(db,"branches");
      const b={id,name:body.name||"",grp:body.grp||"",info:body.info||"",hours:body.hours||"",phone:body.phone||"",landline:body.landline||"",bank_account:body.bank_account||"",iban:body.iban||"",extra_info:body.extra_info||""};
      db.branches.push(b); log(db,"إضافة فرع","branch",id,b.name); save(db); return {id};
    }

    // DOCTORS
    if (method==="GET" && (path==="/doctors" || path.startsWith("/doctors?"))) {
      needAuth();
      const incArch=path.includes("archived=1");
      let docs=db.doctors.filter(d=>incArch||!d.archived).sort((a,b)=>a.name.localeCompare(b.name));
      return {doctors:docs.map(d=>withStatus(d,db))};
    }
    const docM = path.match(/^\/doctors\/(\d+)(\/archive)?$/);
    if (docM) {
      const did=+docM[1];
      if (method==="GET") {
        needAuth();
        const d=db.doctors.find(x=>x.id===did); if(!d) throw Object.assign(new Error("not found"),{status:404});
        const b=db.branches.find(x=>x.id===d.branch_id);
        const doc={...withStatus(d,db), branch_name:b?b.name:"",
          leaves:db.leaves.filter(l=>+l.doctor_id===did).sort((a,b)=>a.start_date.localeCompare(b.start_date))};
        return {doctor:doc};
      }
      if (method==="PUT" && !docM[2]) {
        needEdit();
        const idx=db.doctors.findIndex(x=>x.id===did); if(idx<0) throw Object.assign(new Error("not found"),{status:404});
        const old=db.doctors[idx];
        const updated={...old,...body,id:did};
        if(body.schedule) updated.schedule=body.schedule;
        if(body.dayoff) updated.dayoff=body.dayoff;
        updated.home_visit=body.home_visit?1:0;
        db.doctors[idx]=updated;
        log(db,"تعديل طبيب","doctor",did,updated.name); save(db); return {ok:true};
      }
      if (method==="POST" && docM[2]==="/archive") {
        needEdit();
        const d=db.doctors.find(x=>x.id===did); if(!d) throw Object.assign(new Error("not found"),{status:404});
        d.archived=body.unarchive?0:1;
        log(db,d.archived?"أرشفة طبيب":"استرجاع طبيب","doctor",did,d.name); save(db); return {ok:true};
      }
      if (method==="DELETE") {
        needEdit();
        const d=db.doctors.find(x=>x.id===did);
        db.doctors=db.doctors.filter(x=>x.id!==did);
        db.leaves=db.leaves.filter(l=>l.doctor_id!==did);
        log(db,"حذف طبيب","doctor",did,d?d.name:""); save(db); return {ok:true};
      }
    }
    if (method==="POST" && path==="/doctors") {
      needEdit();
      const id=nextId(db,"doctors");
      const d={id,...body,home_visit:body.home_visit?1:0,archived:0,status:body.status||"active"};
      db.doctors.push(d); log(db,"إضافة طبيب","doctor",id,d.name); save(db); return {id};
    }

    // LEAVES
    if (method==="GET" && path==="/leaves") {
      needAuth();
      const bmap={};db.branches.forEach(b=>bmap[b.id]=b.name);
      const dmap={};db.doctors.forEach(d=>{dmap[d.id]={name:d.name,branch_id:d.branch_id,specialty:d.specialty||""};});
      const today=(()=>{const n=new Date();const p=x=>String(x).padStart(2,'0');return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;})();
      const realLeaves=db.leaves.map(l=>{
        const doc=dmap[l.doctor_id]||{};
        return {...l,doctor_name:doc.name||"",branch_id:doc.branch_id||null,branch_name:bmap[doc.branch_id]||"",specialty:doc.specialty||""};
      });
      // Include doctors manually set to leave status with no active leave record
      const docIdsWithActiveLeave=new Set(db.leaves.filter(l=>l.start_date<=today&&l.end_date>=today).map(l=>l.doctor_id));
      const syntheticLeaves=db.doctors
        .filter(d=>!d.archived&&d.status==="leave"&&!docIdsWithActiveLeave.has(d.id))
        .map(d=>({id:"syn_"+d.id,doctor_id:d.id,start_date:today,end_date:today,type:"وضع يدوي",reason:"",synthetic:true,
          doctor_name:d.name,branch_id:d.branch_id||null,branch_name:bmap[d.branch_id]||"",specialty:d.specialty||""}));
      return {leaves:[...realLeaves,...syntheticLeaves].sort((a,b)=>b.start_date.localeCompare(a.start_date))};
    }
    if (method==="POST" && path==="/leaves") {
      needEdit();
      const id=nextId(db,"leaves");
      const lv={id,doctor_id:+body.doctor_id,start_date:body.start_date,end_date:body.end_date,type:body.type||"إجازة",reason:body.reason||""};
      db.leaves.push(lv);
      const d=db.doctors.find(x=>x.id===lv.doctor_id);
      log(db,"إضافة إجازة","leave",id,`${d?d.name:""} ${lv.start_date}→${lv.end_date}`); save(db); return {id};
    }
    const lvM=path.match(/^\/leaves\/(\d+)$/);
    if(lvM&&method==="PUT"){
      needEdit();
      const l=db.leaves.find(x=>x.id===+lvM[1]);
      if(!l) throw Object.assign(new Error("not found"),{status:404});
      ["start_date","end_date","type","reason"].forEach(k=>{ if(k in body) l[k]=body[k]; });
      log(db,"تعديل إجازة","leave",+lvM[1],""); save(db); return {ok:true};
    }
    if(lvM&&method==="DELETE"){
      needEdit();
      db.leaves=db.leaves.filter(l=>l.id!==+lvM[1]);
      log(db,"حذف إجازة","leave",+lvM[1],""); save(db); return {ok:true};
    }

    // DASHBOARD
    if (method==="GET" && path.startsWith("/dashboard")) {
      needAuth();
      const branch_id=path.includes("branch_id=")?+path.split("branch_id=")[1]:null;
      const {day,nowMin,dateStr}=nowInfo();
      const docs=db.doctors.filter(d=>!d.archived&&(!branch_id||d.branch_id===branch_id));
      const buckets={present:[],upcoming:[],finished:[],leave:[],off:[]};
      const stats={present:0,morning:0,evening:0,leave:0,home_visit_now:0,total:docs.length};
      docs.forEach(d=>{
        const st=computeStatus(d,nowMin,day,dateStr,db.leaves);
        const doc={...d,live:st};
        const bucket=st.state;
        (buckets[bucket]||buckets.off).push(doc);
        if(st.state==="present"){stats.present++;if(d.home_visit)stats.home_visit_now++;}
        if(st.state==="leave") stats.leave++;
        const sc=d.schedule||{};
        const todays=sc[day]||sc[String(day)]||[];
        if(todays.length){const first=Math.min(...todays.map(x=>x[0]));if(first<840)stats.morning++;else stats.evening++;}
      });
      Object.values(buckets).forEach(arr=>arr.sort((a,b)=>a.name.localeCompare(b.name)));
      return {buckets,stats,now:fmtMin(nowMin),day};
    }

    // AVAILABLE NOW
    if (method==="GET" && path==="/available-now") {
      needAuth();
      const {day,nowMin,dateStr}=nowInfo();
      const bmap={};db.branches.forEach(b=>bmap[b.id]=b.name);
      const by_branch={},home=[];
      db.doctors.filter(d=>!d.archived).forEach(d=>{
        const st=computeStatus(d,nowMin,day,dateStr,db.leaves);
        if(st.state!=="present") return;
        const bn=bmap[d.branch_id]||"";
        const doc={...d,live:st,branch_name:bn};
        (by_branch[bn]=by_branch[bn]||[]).push(doc);
        if(d.home_visit) home.push(doc);
      });
      return {by_branch,home_visit:home};
    }

    // SEARCH — comprehensive ranked search across all doctor fields
    if (method==="GET" && path.startsWith("/search")) {
      needAuth();
      const rawQ=decodeURIComponent((path.split("q=")[1]||"").split("&")[0]).trim();
      const qNorm=normalizeAr(rawQ).toLowerCase();
      const {day,nowMin,dateStr}=nowInfo();
      const bmap={};db.branches.forEach(b=>bmap[b.id]=b.name);

      // ── Intent detection (filter-level, before scoring) ─────────────────
      const has=w=>qNorm.includes(w);
      const wantAvail  = has("متاح الان")||has("موجود الان")||has("متاحين")||has("الحاضرين")||has("موجود الان")||has("حاضر الان");
      const wantLeave  = (has("اجازه")||has("اجازة")||has("مجازه")) && !wantAvail;
      const wantHome   = has("زياره منزليه")||has("زياره منزل")||has("منزليه");
      const wantMorning= has("صباحي")||has("الشفت الصباحي")||has("شفت صباح");
      const wantEvening= has("مسائي")||has("الشفت المسائي")||has("شفت مساء");

      // ── Tokenise — strip stop words so "طبيب باطنة" → ["باطنه"] ─────────
      const STOP=new Set(["طبيب","طبيبه","طبيبة","دكتور","دكتوره","دكتورة","الدكتور","د",
        "الان","الآن","متاح","متاحين","موجود","حاضر","يوجد","عنده","عندهم",
        "ابحث","ابغا","ابغى","ايش","في","من","هل","هو","هي"]);
      const tokens=qNorm.split(/\s+/).map(t=>t.trim()).filter(t=>t.length>0&&!STOP.has(t));

      // ── Scoring helpers ──────────────────────────────────────────────────
      function scoreName(t,n){
        if(!n||!t)return 0;
        const ws=n.split(/\s+/).filter(Boolean);
        if(n===t)                          return 10000;
        if(n.startsWith(t))               return  5000;
        if(ws[0]&&ws[0]===t)              return  4000;
        if(ws[0]&&ws[0].startsWith(t))    return  3000;
        if(ws.some(w=>w===t))             return  2000;
        if(ws.some(w=>w.startsWith(t)))   return  1500;
        if(n.includes(t))                 return   500;
        return 0;
      }
      function scoreEnName(t,en){
        if(!en||!t)return 0;
        const tl=t.toLowerCase(),nl=en.toLowerCase();
        const ws=nl.split(/\s+/).filter(Boolean);
        if(nl===tl)                        return 8000;
        if(nl.startsWith(tl))             return 4000;
        if(ws[0]&&ws[0]===tl)             return 3500;
        if(ws[0]&&ws[0].startsWith(tl))   return 2500;
        if(ws.some(w=>w===tl))            return 1800;
        if(ws.some(w=>w.startsWith(tl)))  return 1200;
        if(nl.includes(tl))               return  400;
        return 0;
      }
      function scoreField(t,v,w){
        if(!v||!t)return 0;
        const vn=normalizeAr(v).toLowerCase();
        const ws=vn.split(/\s+/).filter(Boolean);
        if(vn===t)                          return w*100;
        if(vn.startsWith(t))               return w* 60;
        if(ws.some(wd=>wd===t))            return w* 50;
        if(ws.some(wd=>wd.startsWith(t)))  return w* 35;
        if(vn.includes(t))                 return w* 15;
        return 0;
      }
      // Status label matching (e.g. "موجود" → present doctors)
      const STATUS_LABELS={present:["موجود الان","موجود","حاضر","متواجد"],
        upcoming:["يبدا لاحقا","يبدا","قريبا"],finished:["انتهي","انتهي دوامه"],
        leave:["اجازه","اجازة","مجازه","في اجازه"],off:["اجازه اسبوعيه","يوم اجازه"]};
      function scoreStatus(t,state){
        const labels=STATUS_LABELS[state]||[];
        return labels.some(l=>l.includes(t)||t.includes(l.split(" ")[0]))?200:0;
      }
      // Shift-time text matching: "8" / "4م" / "10ص"
      function scoreShifts(t,sc){
        if(!sc)return 0;
        const shiftStr=Object.values(sc).flat().map(([s,e])=>fmtMin(s)+"–"+fmtMin(e)).join(" ");
        const shiftNorm=shiftStr.replace(/\s/g,"").toLowerCase();
        return shiftStr.includes(t)||shiftNorm.includes(t)?30:0;
      }
      // ────────────────────────────────────────────────────────────────────

      // Pre-compute first-shift hour for morning/evening filter
      const firstShiftMin=(d)=>{
        const sh=(d.schedule&&(d.schedule[day]||d.schedule[String(day)]))||[];
        return sh.length?sh[0][0]:null;
      };

      const out=[];
      db.doctors.filter(d=>!d.archived).forEach(d=>{
        const st=computeStatus(d,nowMin,day,dateStr,db.leaves);

        // Intent-level hard filters
        if(wantAvail   && st.state!=="present") return;
        if(wantLeave   && st.state!=="leave")   return;
        if(wantHome    && !d.home_visit)        return;
        if(wantMorning ){ const fs=firstShiftMin(d); if(fs===null||fs>=14*60) return; }
        if(wantEvening ){ const fs=firstShiftMin(d); if(fs===null||fs< 14*60) return; }

        if(!tokens.length&&!(wantAvail||wantLeave||wantHome||wantMorning||wantEvening)) return;

        // Pre-normalise fields once per doctor
        const nameN    = normalizeAr(d.name||"").toLowerCase();
        const enName   = (d.en_name||d.name_en||"").trim().toLowerCase();
        const specN    = normalizeAr(d.specialty||"").toLowerCase();
        const rankN    = normalizeAr(d.rank||"").toLowerCase();
        const natN     = normalizeAr(d.nationality||"").toLowerCase();
        const branchN  = normalizeAr(bmap[d.branch_id]||"").toLowerCase();
        const qualN    = normalizeAr(d.qualification||"").toLowerCase();
        const genderN  = normalizeAr(d.gender||"").toLowerCase();
        const expN     = normalizeAr(d.experience||"").toLowerCase();
        const casesN   = normalizeAr(d.cases||"").toLowerCase();
        const coordN   = normalizeAr(d.notes_coord||"").toLowerCase();
        const hoursN   = normalizeAr(d.hours_raw||"").toLowerCase();

        let totalScore=0, allMatch=true;
        for(const t of tokens){
          const s=Math.max(
            scoreName   (t, nameN),                    // name:      10000
            scoreEnName (t, enName),                   // en name:    8000
            scoreField  (t, specN,    10),             // specialty:  1000 max
            scoreField  (t, rankN,     9),             // rank:        900
            scoreField  (t, branchN,   8),             // branch:      800
            scoreField  (t, natN,      7),             // nationality: 700
            scoreStatus (t, st.state),                 // status:      200
            scoreField  (t, qualN,     5),             // qualification:500
            scoreField  (t, genderN,   4),             // gender:       400
            scoreField  (t, expN,      3),             // experience:   300
            scoreField  (t, hoursN,    4),             // hours text:   400
            scoreField  (t, casesN,    2),             // cases:        200
            scoreField  (t, coordN,    2),             // coord notes:  200
            scoreShifts (t, d.schedule)                // shift times:   30
          );
          if(!s){allMatch=false;break;}
          totalScore+=s;
        }
        if(tokens.length&&!allMatch) return;

        // Availability boost — never overrides name quality ranking
        if(st.state==="present")       totalScore+=30;
        else if(st.state==="upcoming") totalScore+=10;

        out.push({...d,live:st,branch_name:bmap[d.branch_id]||"",_score:totalScore});
      });

      out.sort((a,b)=>b._score-a._score||a.name.localeCompare(b.name));
      return {results:out.slice(0,80),count:out.length};
    }

    // BEST DOCTOR
    if (method==="POST" && path==="/best-doctor") {
      needAuth();
      const {specialty, branch_id, gender} = body||{};
      const {day,nowMin,dateStr} = nowInfo();
      const bmap={}; db.branches.forEach(b=>bmap[b.id]=b.name);
      const PRIO={present:0,upcoming:1,finished:2,off:3,leave:4,archived:5};
      let docs=db.doctors.filter(d=>!d.archived);
      if(specialty) docs=docs.filter(d=>d.specialty===specialty);
      if(branch_id) docs=docs.filter(d=>d.branch_id===+branch_id);
      if(gender) docs=docs.filter(d=>d.gender===gender);
      docs=docs.map(d=>{const st=computeStatus(d,nowMin,day,dateStr,db.leaves);
        return {...d,live:st,branch_name:bmap[d.branch_id]||""};});
      docs.sort((a,b)=>{const pa=PRIO[a.live.state]??9,pb=PRIO[b.live.state]??9;
        return pa!==pb?pa-pb:a.name.localeCompare(b.name);});
      return {results:docs};
    }

    // AUDIT
    if (method==="GET" && path==="/audit") {
      needEdit();
      return {audit:db.audit.slice(0,300)};
    }

    throw Object.assign(new Error("not found"),{status:404});
  }

  // ── Public call ───────────────────────────────────────────────
  async function call(path, opts={}) {
    await ensureInit();
    const method=(opts.method||"GET").toUpperCase();
    const body=opts.body||{};
    let result;
    try {
      result = route(method, path, body);
    } catch(e) {
      const status=e.status||500;
      if(status===401) throw Object.assign(new Error(e.message||"auth"),{isAuth:true});
      throw new Error(e.message||"خطأ");
    }
    return result;
  }

  ensureInit(); // start loading in background

  function exportDB() {
    const db = load();
    return db ? JSON.parse(JSON.stringify(db)) : null;
  }

  return { call: (m,p,b)=>{ if(m==="GET"&&p==="/export-db") return exportDB(); return call(m,p,b); }, reset: async()=>{ const fresh=JSON.parse(JSON.stringify({doctors:SEED.doctors,branches:SEED.branches,leaves:[],settings:SEED.settings,audit:[],_seq:SEED._seq||{doctors:200,branches:10,leaves:50,audit:100}})); _memDB=fresh; if(_docRef) await _docRef.set(fresh); }, getSEED:()=>SEED };
})();

  </script>
  <script>
/* ============ Adelcare SPA ============ */
const App = (() => {
  const state = { user: null, route: "dashboard", params: {}, sidebarOpen: false, adminUnlocked: false };
  const DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  // week starts on Saturday (Saudi). Display order of JS getDay() indices:
  const WEEK_ORDER = [6,0,1,2,3,4,5];   // السبت، الأحد، ... الجمعة
  const colOf = (jsDay)=>(jsDay+1)%7;   // calendar column for a getDay() value
  const DEPT_ORDER = ["طب عام","باطنة","صدرية","أطفال","نساء وولادة","جلدية","عظام",
    "أنف وأذن وحنجرة","عيون","مسالك بولية","جراحة","أسنان","علاج طبيعي","المختبر","الأشعة"];
  const deptRank = (s)=>{ const i=DEPT_ORDER.indexOf(s); return i<0?999:i; };
  // availability priority: present -> upcoming(soonest) -> finished -> off -> leave
  const STATE_PRIORITY = {present:0, upcoming:1, finished:2, off:3, leave:4, archived:5};
  function availSort(a,b){
    const pa=STATE_PRIORITY[a.live.state]??9, pb=STATE_PRIORITY[b.live.state]??9;
    if(pa!==pb) return pa-pb;
    if(a.live.state==="upcoming") return (a.live.next_start??9999)-(b.live.next_start??9999) || a.name.localeCompare(b.name);
    if(a.live.state==="present") return (b.live.shift_end??0)-(a.live.shift_end??0) || a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name);
  }
  const normAr = s=>(s||"").trim().replace(/[ً-ٰٟـ]/g,"")
    .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase();

  // ── Shared scoring helpers ────────────────────────────────────────────────
  const _STOP=new Set(["طبيب","طبيبه","طبيبة","دكتور","دكتوره","دكتورة","الدكتور","د"]);
  function scoreNameFn(t,n){
    if(!n||!t)return 0;
    const ws=n.split(/\s+/).filter(Boolean);
    if(n===t)                          return 10000;
    if(n.startsWith(t))               return  5000;
    if(ws[0]&&ws[0]===t)              return  4000;
    if(ws[0]&&ws[0].startsWith(t))    return  3000;
    if(ws.some(w=>w===t))             return  2000;
    if(ws.some(w=>w.startsWith(t)))   return  1500;
    if(n.includes(t))                 return   500;
    return 0;
  }
  function scoreEnNameFn(t,en){
    if(!en||!t)return 0;
    const tl=t,nl=en.toLowerCase();
    const ws=nl.split(/\s+/).filter(Boolean);
    if(nl===tl)                        return 8000;
    if(nl.startsWith(tl))             return 4000;
    if(ws[0]&&ws[0]===tl)             return 3500;
    if(ws[0]&&ws[0].startsWith(tl))   return 2500;
    if(ws.some(w=>w===tl))            return 1800;
    if(ws.some(w=>w.startsWith(tl)))  return 1200;
    if(nl.includes(tl))               return  400;
    return 0;
  }
  function scoreFieldFn(t,v,w){
    if(!v||!t)return 0;
    const vn=normAr(v);
    const ws=vn.split(/\s+/).filter(Boolean);
    if(vn===t)                          return w*100;
    if(vn.startsWith(t))               return w* 60;
    if(ws.some(wd=>wd===t))            return w* 50;
    if(ws.some(wd=>wd.startsWith(t)))  return w* 35;
    if(vn.includes(t))                 return w* 15;
    return 0;
  }
  function scoreDoctorMgmt(q,d,bname){
    if(!q)return 1;
    const qNorm=normAr(q);
    const tokens=qNorm.split(/\s+/).filter(t=>t.length>0&&!_STOP.has(t));
    if(!tokens.length)return 1;
    const nameN=normAr(d.name||"");
    const enName=(d.en_name||d.name_en||"").toLowerCase();
    const specN=normAr(d.specialty||"");
    const rankN=normAr(d.rank||"");
    const natN=normAr(d.nationality||"");
    const branchN=normAr(bname[d.branch_id]||"");
    const qualN=normAr(d.qualification||"");
    const genderN=normAr(d.gender||"");
    const expN=normAr(d.experience||"");
    const casesN=normAr(d.cases||"");
    const coordN=normAr(d.notes_coord||"");
    let total=0;
    for(const t of tokens){
      const s=Math.max(
        scoreNameFn(t,nameN),
        scoreEnNameFn(t,enName),
        scoreFieldFn(t,specN,10),
        scoreFieldFn(t,rankN,9),
        scoreFieldFn(t,branchN,8),
        scoreFieldFn(t,natN,7),
        scoreFieldFn(t,qualN,5),
        scoreFieldFn(t,genderN,4),
        scoreFieldFn(t,expN,3),
        scoreFieldFn(t,casesN,2),
        scoreFieldFn(t,coordN,2)
      );
      if(!s)return 0;
      total+=s;
    }
    return total;
  }
  // ─────────────────────────────────────────────────────────────────────────

  const $ = (s, r=document) => r.querySelector(s);
  const el = (h) => { const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; };
  const esc = (s) => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // ---------- API ----------
  async function api(path, opts={}) {
    try {
      return await LocalDB.call(path, opts);
    } catch(e) {
      if (e.isAuth && state.user) { state.user=null; render(); }
      throw e;
    }
  }
  // every editable action is gated by edit-mode (unlocked with the edit code)
  const can = (a) => !!(state.user && state.user.edit);

  // ---------- Toast ----------
  function toast(msg,type=""){
    const cls=type==="ok"?" toast-ok":type==="err"?" toast-err":"";
    const t=el(`<div class="toast${cls}">${esc(msg)}</div>`);
    $("#toast-root").appendChild(t); setTimeout(()=>t.remove(),2400); }

  // ---------- Theme ----------
  function initTheme(){ const t=localStorage.getItem("theme")||"light";
    document.documentElement.setAttribute("data-theme",t); }
  function toggleTheme(){ const c=document.documentElement.getAttribute("data-theme");
    const n=c==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",n);
    localStorage.setItem("theme",n); const b=$("#theme-ico"); if(b)b.textContent=n==="dark"?"☀️":"🌙"; }

  // ---------- helpers ----------
  const initials = (n)=> (n||"؟").replace(/^د\.?\s*/,"").trim().slice(0,2);
  const avatar = (d)=> d.photo ? `<div class="avatar"><img src="${esc(d.photo)}"></div>`
      : `<div class="avatar">${esc(initials(d.name))}</div>`;
  const STATE_CLS = {present:"present",upcoming:"upcoming",finished:"finished",leave:"leave",off:"off",archived:"off"};
  function statusPill(live){ const s=live.state;
    return `<span class="status-pill sp-${STATE_CLS[s]}"><span class="dot" style="background:currentColor"></span>${esc(live.label)}</span>`; }

  function todayShift(d){
    if(!d.schedule) return "";
    const day=new Date().getDay();
    const sh=d.schedule[day]||d.schedule[String(day)];
    if(!sh||!sh.length) return "";
    return sh.map(([s,e])=>fmtRange(s,e)).join(" ، ");
  }
  function doctorCard(d){
    const live=d.live||{state:"off",label:""};
    const isLeave=live.state==="leave";
    const meta=[d.rank&&d.rank!==d.specialty?d.rank:null, d.nationality, d.experience?fmtExp(d.experience):null]
      .filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('<span class="shift-sep">·</span>');
    const shift=isLeave?"":todayShift(d);
    // Unified info row: shift times for working doctors, leave info for on-leave doctors
    const infoRow=shift
      ?`<div class="dcard-shift">${shift.split(" ، ").map(s=>`<span class="shift-seg">🕐 ${esc(s)}</span>`).join('<span class="shift-sep"> · </span>')}</div>`
      :isLeave
        ?`<div class="dcard-shift dcard-leave-info"><span>🔴 ${esc(live.leaveType||"إجازة")}${live.leave&&live.leave.end_date?` · حتى ${esc(fmtDate(live.leave.end_date))}`:""}  </span></div>`
        :"";
    const branchRow=d.branch_name?`<div class="dcard-meta" style="margin-top:3px"><span>🏥 ${esc(d.branch_name)}</span></div>`:"";
    return `<div class="dcard st-${STATE_CLS[live.state]}" data-doc="${d.id}">
      ${avatar(d)}
      <div class="dcard-body">
        <div class="dcard-top">
          <div class="dcard-name">${esc(d.name)}</div>
          ${statusPill(live)}
        </div>
        <div class="dcard-meta"><span class="spec-tag">${esc(d.specialty||"")}</span>${meta}</div>
        ${infoRow}
        ${branchRow}
      </div></div>`;
  }
  function bindCards(root){ root.querySelectorAll("[data-doc]").forEach(c=>
    c.addEventListener("click",()=>quickCard(c.dataset.doc).catch(e=>toast(e.message||"خطأ","err")))); }

  // ---------- Quick doctor card (modal) ----------
  async function quickCard(id){
    const {doctor:d}=await api("/doctors/"+id);
    const live=d.live||{};
    const isOnLeave=live.state==="leave";
    const sc=d.schedule||{};
    const sched = WEEK_ORDER.map(i=>[i,sc[i]||sc[String(i)]]).filter(([i,v])=>v&&v.length)
      .map(([i,v])=>`<div><b>${DAYS[i]}:</b> ${v.map(([s,e])=>fmtRange(s,e)).join(" ، ")}</div>`).join("")||"—";
    const offs=(d.dayoff||[]).slice().sort((a,b)=>WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b)).map(i=>DAYS[i]).join("، ")||"—";

    // Active leave from live status
    const activeLv=isOnLeave ? (live.leave || (d.leaves||[]).find(l=>{const n=new Date();const p=x=>String(x).padStart(2,'0');const t=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;return l.start_date<=t&&l.end_date>=t;})) : null;
    // Upcoming (future) leaves
    const today=(()=>{const n=new Date(),p=x=>String(x).padStart(2,'0');return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;})();
    const upcomingLeaves=(d.leaves||[]).filter(l=>l.start_date>today).sort((a,b)=>a.start_date.localeCompare(b.start_date));

    const rows=[
      ["التخصص", `${esc(d.specialty)}${d.rank?` — ${esc(d.rank)}`:""}`],
      ["الحالة الآن", statusPill(live)+(live.detail?` <span style="color:var(--muted)">${esc(live.detail)}</span>`:"")],
      ["الفرع", esc(d.branch_name)],
      ["الجنسية", esc(d.nationality)||"—"],
      ["الخبرة", esc(fmtExp(d.experience))||"—"],
      ["الجنس", esc(d.gender)||"—"],
      ["الدوام", `<div style="font-size:13px;line-height:1.9">${sched}</div>`],
      ["الإجازة الأسبوعية", offs],
      ["الحالات المستقبلة", esc(d.cases)||"—"],
      ["ملاحظات التنسيق", esc(d.notes_coord)||"—"],
    ];
    if(can("doctor.edit") && d.notes_admin) rows.push(["ملاحظات إدارية", esc(d.notes_admin)]);

    const hasLeaveRecord=!!activeLv;
    const leaveSection=isOnLeave?`
      <div class="leave-active-row">
        <div>
          <div class="la-info">🔴 ${esc(activeLv?activeLv.type:live.leaveType||"إجازة")}</div>
          ${activeLv?`<div class="la-dates">من ${esc(fmtDate(activeLv.start_date))} إلى ${esc(fmtDate(activeLv.end_date))}${activeLv.reason?` · ${esc(activeLv.reason)}`:""}</div>`:""}
        </div>
        ${hasLeaveRecord?`<div class="la-actions">
          <button class="btn btn-xs btn-ghost" data-edit-leave="${activeLv.id}">تعديل</button>
          <button class="btn btn-xs btn-danger" data-del-leave="${activeLv.id}">إلغاء</button>
        </div>`:""}
      </div>`:"";

    const upcomingSection=upcomingLeaves.map(ul=>`
      <div class="leave-upcoming-row" data-ul-id="${ul.id}">
        <div>
          <div class="lu-info">🟡 إجازة قادمة · ${esc(ul.type||"إجازة")}</div>
          <div class="lu-dates">من ${esc(fmtDate(ul.start_date))} إلى ${esc(fmtDate(ul.end_date))}${ul.reason?` · ${esc(ul.reason)}`:""}</div>
        </div>
        <div class="lu-actions">
          <button class="btn btn-xs btn-ghost" data-edit-ul="${ul.id}">تعديل</button>
          <button class="btn btn-xs btn-danger" data-del-ul="${ul.id}">إلغاء</button>
        </div>
      </div>`).join("");

    const body=`
      <div class="qd-head">
        <div class="avatar qd-avatar">${d.photo?`<img src="${esc(d.photo)}">`:esc(initials(d.name))}</div>
        <div>
          <div class="qd-name">${esc(d.name)}</div>
          <div style="margin-top:6px">${statusPill(live)}</div>
        </div>
      </div>
      ${leaveSection}${upcomingSection}
      <div class="qd-rows">${rows.map(([k,v])=>`<div class="qd-row"><div class="k">${k}</div><div class="vv">${v}</div></div>`).join("")}</div>`;

    const foot=`<button class="btn btn-primary" data-edit="${d.id}">✎ تعديل</button>
      ${isOnLeave&&!hasLeaveRecord
        ?`<button class="btn btn-ghost" data-end-leave="${d.id}">إلغاء الإجازة</button>`
        :`<button class="btn btn-ghost" data-leave="${d.id}">＋ إجازة</button>`}`;

    openModal({title:d.name, bodyHTML:body, footHTML:foot, onMount:(m)=>{
      const eb=m.querySelector("[data-edit]"); if(eb)eb.onclick=()=>requireEdit(()=>doctorForm(d));
      const lb=m.querySelector("[data-leave]"); if(lb)lb.onclick=()=>requireEdit(()=>leaveForm(d.id,d.name));
      // Active leave inline buttons
      const elb=m.querySelector("[data-edit-leave]"); if(elb)elb.onclick=()=>requireEdit(()=>leaveEditForm(activeLv,()=>{closeModal();quickCard(id);}));
      const dlb=m.querySelector("[data-del-leave]"); if(dlb)dlb.onclick=()=>requireEdit(async()=>{
        if(!confirm("إلغاء الإجازة الحالية؟"))return;
        try{await api("/leaves/"+activeLv.id,{method:"DELETE"});toast("✅ تم إلغاء الإجازة","ok");closeModal();go(state.route);}
        catch(e){toast("❌ "+e.message,"err");}
      });
      // End manual leave (doctor.status="leave" with no leave record)
      const elv=m.querySelector("[data-end-leave]"); if(elv)elv.onclick=()=>requireEdit(async()=>{
        if(!confirm("إلغاء الإجازة وإعادة الممارس للعمل؟"))return;
        try{await api("/doctors/"+d.id,{method:"PUT",body:{...d,status:"active"}});
          toast("✅ تم إلغاء الإجازة","ok");closeModal();go(state.route);}
        catch(e){toast("❌ "+e.message,"err");}
      });
      // Upcoming leave inline buttons
      upcomingLeaves.forEach(ul=>{
        const eul=m.querySelector(`[data-edit-ul="${ul.id}"]`);
        if(eul)eul.onclick=()=>requireEdit(()=>leaveEditForm(ul,()=>{closeModal();quickCard(id);}));
        const dul=m.querySelector(`[data-del-ul="${ul.id}"]`);
        if(dul)dul.onclick=()=>requireEdit(async()=>{
          if(!confirm("إلغاء الإجازة القادمة؟"))return;
          try{await api("/leaves/"+ul.id,{method:"DELETE"});toast("✅ تم إلغاء الإجازة","ok");closeModal();quickCard(id);}
          catch(e){toast("❌ "+e.message,"err");}
        });
      });
    }});
  }
  function fmtDate(iso){
    if(!iso) return "";
    const p=iso.split("-");
    if(p.length<3) return iso;
    return `${+p[2]}/${+p[1]}/${p[0]}`;
  }
  function fmtRange(s,e){ return `${fmtMin(s)}–${fmtMin(e)}`; }
  function fmtMin(m){ m=((m%1440)+1440)%1440; let h=Math.floor(m/60),mm=m%60;
    const suf=h<12?"ص":"م"; let h12=h%12||12;
    return mm?`${h12}:${String(mm).padStart(2,"0")}${suf}`:`${h12}${suf}`; }
  // Format experience: "3" → "3 سنوات", "13" → "13 سنة", already-formatted → as-is
  function fmtExp(v){
    if(!v)return "";
    const s=String(v).trim();
    if(/[أ-ي]/.test(s)) return s; // already has Arabic text
    const n=parseFloat(s);
    if(isNaN(n)) return s;
    if(n===1) return "سنة واحدة";
    if(n===2) return "سنتان";
    if(n>=3&&n<=10) return `${n} سنوات`;
    return `${n} سنة`;
  }

  // ---------- Modal infra ----------
  function openModal({title,bodyHTML,footHTML,wide,onMount}){
    const back=el(`<div class="modal-back"><div class="modal ${wide?'wide':''}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-x>✕</button></div>
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML?`<div class="modal-foot">${footHTML}</div>`:""}
    </div></div>`);
    back.addEventListener("click",e=>{if(e.target===back)closeModal();});
    back.querySelector("[data-x]").onclick=closeModal;
    const root=$("#modal-root");
    root.querySelectorAll(".modal-back").forEach(b=>b.remove()); // replace any open modal instantly
    root.appendChild(back);
    document.body.classList.add("modal-open");   // lock background scroll (no reflow flash)
    if(onMount)onMount(back.querySelector(".modal"));
  }
  function closeModal(){
    const root=$("#modal-root"); const back=root.querySelector(".modal-back");
    const finish=()=>{ root.innerHTML=""; document.body.classList.remove("modal-open");
    };
    // Re-lock edit mode after closing any modal outside admin/control panels
    if(state.user && state.user.edit && state.route!=="control" && state.route!=="admin"){
      api("/lock",{method:"POST"}).then(u=>{state.user=u; toast("🔒 تم قفل وضع التعديل");}).catch(()=>{});
    }
    if(back){ back.classList.add("closing"); setTimeout(finish,150); }
    else finish();
  }

  // ---------- Global search ----------
  // Dropdown lives at body level (position:fixed) — outside topbar stacking context.
  // We keep exactly ONE repos + ONE click handler across renders using module-level refs.
  let searchT=null, _searchDD=null, _searchRepos=null, _searchClick=null;

  function getDD(){
    if(!_searchDD||!document.body.contains(_searchDD)){
      _searchDD=document.createElement("div");
      _searchDD.id="search-dd";
      _searchDD.style.display="none";
      document.body.appendChild(_searchDD);
    }
    return _searchDD;
  }
  function positionDD(inp,dd){
    const r=inp.getBoundingClientRect();
    if(!r.width) return; // element not visible / not in layout
    const vvh=window.visualViewport?window.visualViewport.height:window.innerHeight;
    const spaceBelow=Math.max(160, vvh - r.bottom - 16);
    dd.style.top       =(r.bottom+5)+"px";
    dd.style.bottom    ="auto";
    dd.style.left      =r.left+"px";
    dd.style.right     ="auto";
    dd.style.width     =r.width+"px";
    dd.style.maxHeight =Math.min(spaceBelow,520)+"px";
  }
  function setupSearch(){
    const inp=$("#gsearch"); if(!inp)return;
    const dd=getDD();

    // Remove previous listeners so they don't accumulate across renders
    if(_searchRepos){
      window.removeEventListener("scroll",_searchRepos);
      if(window.visualViewport) window.visualViewport.removeEventListener("resize",_searchRepos);
    }
    if(_searchClick) document.removeEventListener("click",_searchClick);

    _searchRepos=()=>{ if(dd.style.display!=="none") positionDD(inp,dd); };
    window.addEventListener("scroll",_searchRepos,{passive:true});
    if(window.visualViewport) window.visualViewport.addEventListener("resize",_searchRepos);

    _searchClick=(e)=>{
      if(!e.target.closest(".search-wrap")&&!e.target.closest("#search-dd")&&!e.target.closest("#modal-root"))
        dd.style.display="none";
    };
    document.addEventListener("click",_searchClick);

    inp.addEventListener("input",()=>{clearTimeout(searchT);searchT=setTimeout(doSearch,80);});

    async function doSearch(){
      const q=inp.value.trim();
      if(!q){dd.style.display="none";return;}
      // Populate content first, then position + show — so errors in API don't hide the dropdown
      let html=`<div class="empty" style="padding:24px">لا نتائج</div>`;
      try{
        const {results}=await api("/search?q="+encodeURIComponent(q));
        if(results.length) html=`<div style="display:grid;gap:7px">${results.map(doctorCard).join("")}</div>`;
      }catch(err){ html=`<div class="empty" style="padding:24px">حدث خطأ في البحث</div>`; }
      dd.innerHTML=html;
      positionDD(inp,dd);
      dd.style.display="block";
      bindCards(dd);
      // Close dropdown & clear input when a search result is selected
      dd.querySelectorAll("[data-doc]").forEach(c=>c.addEventListener("click",()=>{
        dd.style.display="none";
        inp.value="";
      },{capture:true}));
    }
  }

  // ---------- Topbar date widget ----------
  function buildTopbarDate(){
    const now=new Date();
    const dayName=DAYS[now.getDay()];
    let hijri="";
    try{ hijri=new Intl.DateTimeFormat("ar",{calendar:"islamic",day:"numeric",month:"long",year:"numeric"}).format(now); }catch(e){}
    let greg="";
    try{ greg=new Intl.DateTimeFormat("ar",{calendar:"gregory",day:"numeric",month:"long",year:"numeric"}).format(now); }catch(e){
      const AR_MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
      greg=`${now.getDate()} ${AR_MONTHS[now.getMonth()]} ${now.getFullYear()}`;
    }
    return `<div class="topbar-date">
      <span class="td-day">${esc(dayName)}</span>
      ${hijri?`<span class="td-hijri">🌙 ${esc(hijri)}</span>`:""}
      ${greg?`<span class="td-greg">📅 ${esc(greg)}</span>`:""}
    </div>`;
  }

  // ============================================================ DASHBOARD
  let dashBranch="";   // "" = all branches
  let dashSpec="";     // "" = all specialties
  let dashStat="";     // "" | present | morning | evening | leave (stat-card filter)
  let dashDay=-1;      // -1 = today (live), 0-6 = specific JS weekday
  routes.dashboard=async()=>{
    shell(`<div class="loader"><div class="spin"></div></div>`);
    const [{doctors},{branches}]=await Promise.all([api("/doctors"),api("/branches")]);
    const bname={}; branches.forEach(b=>bname[b.id]=b.name);
    doctors.forEach(d=>d.branch_name=bname[d.branch_id]||"");
    const dayIdx=new Date().getDay();
    const firstStart=(d)=>{const sh=(d.schedule&&(d.schedule[dayIdx]||d.schedule[String(dayIdx)]))||[];
      return sh.length?Math.min(...sh.map(x=>x[0])):null;};
    const presentInBranch=(bid)=>doctors.filter(d=>d.branch_id===bid&&d.live.state==="present").length;
    const allSpecs=[...new Set(doctors.map(d=>d.specialty))].filter(Boolean).sort((a,b)=>deptRank(a)-deptRank(b)||a.localeCompare(b));

    const totalPresent=doctors.filter(d=>d.live.state==="present").length;
    const branchBar=`<div class="branch-bar" id="branch-bar">
      <button class="bchip bchip-branch bchip-all ${dashBranch===""?"on":""}" data-bf="">
        <span class="bchip-top">🏥 الكل <span class="bchip-n">${totalPresent}</span></span>
        <span class="bchip-hours">جميع الممارسين والفروع</span>
      </button>
      ${branches.map(b=>`
        <button class="bchip bchip-branch ${String(dashBranch)===String(b.id)?"on":""}" data-bf="${b.id}">
          <span class="bchip-top"><span class="bchip-name">${esc(b.name)}</span><span class="bchip-n">${presentInBranch(b.id)}</span></span>
          <span class="bchip-hours">${b.hours?`🕐 ${esc(b.hours)}`:""}</span>
        </button>`).join("")}
    </div>`;

    // helper: does doctor have shifts on given JS weekday?
    const hasShiftOn=(d,jsDay)=>{const sh=d.schedule&&(d.schedule[jsDay]||d.schedule[String(jsDay)]);return sh&&sh.length>0;};
    // shifts for a given day as formatted string
    const shiftsForDay=(d,jsDay)=>{const sh=(d.schedule&&(d.schedule[jsDay]||d.schedule[String(jsDay)]))||[];
      return sh.map(([s,e])=>fmtRange(s,e)).join(" ، ");};

    function drawBody(){
      const body=$("#dash-body"); body.classList.add("fade");
      const isToday=dashDay===-1;
      const viewDay=isToday?dayIdx:dashDay;
      const branchDocs=doctors.filter(d=>!dashBranch||String(d.branch_id)===String(dashBranch));

      // stat cards only for today view
      let statCardsHTML="";
      if(isToday){
        let present=0,leave=0,morning=0,evening=0;
        branchDocs.forEach(d=>{const s=d.live.state;
          if(s==="present")present++;
          if(s==="leave"){leave++;return;}
          const fs=firstStart(d); if(fs!=null){if(fs<14*60)morning++;else evening++;}});
        const statLabels={present:"المتواجدون الآن",morning:"الشفت الصباحي",evening:"الشفت المسائي",leave:"الممارسون في إجازة"};
        statCardsHTML=`<div class="mini-stats">${[
          {k:"present",v:present,l:"متواجد الآن",c:"green",b:"🟢"},
          {k:"morning",v:morning,l:"الشفت الصباحي",c:"amber",b:"🌅"},
          {k:"evening",v:evening,l:"الشفت المسائي",c:"brand",b:"🌙"},
          {k:"leave",v:leave,l:"في إجازة",c:"leave",b:"🔴"},
        ].map(x=>`<button class="mini-stat s-${x.c} ${dashStat===x.k?"active":""}" data-stat="${x.k}">
          <span class="ms-ico">${x.b}</span><div><div class="ms-v">${x.v}</div><div class="ms-l">${x.l}</div></div></button>`).join("")}</div>
          ${dashStat?`<button class="chip-clear" id="clear-stat">✕ ${statLabels[dashStat]} (إلغاء)</button>`:""}`;
      }

      // combined filter
      const matchStat=(d)=>{
        if(!isToday||!dashStat) return true;
        if(dashStat==="present") return d.live.state==="present";
        if(dashStat==="leave")   return d.live.state==="leave";
        const fs=firstStart(d);
        if(dashStat==="morning") return fs!=null&&fs<14*60;
        if(dashStat==="evening") return fs!=null&&fs>=14*60;
        return true;
      };
      const listDocs=branchDocs.filter(d=>
        (!dashSpec||d.specialty===dashSpec) &&
        matchStat(d) &&
        (isToday || hasShiftOn(d,viewDay))
      );

      const bySpec={}; listDocs.forEach(d=>{(bySpec[d.specialty]=bySpec[d.specialty]||[]).push(d);});
      const ordered=Object.keys(bySpec).sort((a,b)=>deptRank(a)-deptRank(b)||a.localeCompare(b));

      const sections=ordered.map(sp=>{
        let arr=bySpec[sp];
        if(isToday) arr=arr.slice().sort(availSort);
        else arr=arr.slice().sort((a,b)=>{
          const sa=(a.schedule&&(a.schedule[viewDay]||a.schedule[String(viewDay)])||[])[0]?.[0]??9999;
          const sb=(b.schedule&&(b.schedule[viewDay]||b.schedule[String(viewDay)])||[])[0]?.[0]??9999;
          return sa-sb||a.name.localeCompare(b.name);
        });
        const cards=isToday?arr.map(doctorCard).join(""):arr.map(d=>{
          const shStr=shiftsForDay(d,viewDay);
          const live=d.live||{state:"off"};
          return `<div class="dcard" data-doc="${d.id}">
            ${avatar(d)}
            <div class="dcard-body">
              <div class="dcard-top"><div class="dcard-name">${esc(d.name)}</div></div>
              <div class="dcard-meta"><span class="spec-tag">${esc(d.specialty||"")}</span>${d.nationality?`<span>${esc(d.nationality)}</span>`:""}${d.branch_name?`<span>🏥 ${esc(d.branch_name)}</span>`:""}</div>
              ${shStr?`<div class="dcard-meta"><span>🕐 ${esc(shStr)}</span></div>`:""}
            </div></div>`;
        }).join("");
        return `<div class="section-head"><h2>${esc(sp)}</h2><span class="count">${arr.length}</span></div>
          <div class="status-grid">${cards}</div>`;
      }).join("")||`<div class="empty" style="padding:34px">لا يوجد ممارسون في هذا اليوم</div>`;

      const now=new Date(); const nowTxt=fmtMin(now.getHours()*60+now.getMinutes());
      const branchLabel=dashBranch?(" · "+(bname[dashBranch]||"")):"";
      const dayOpts=`<option value="-1" ${dashDay===-1?"selected":""}>اليوم</option>`+
        WEEK_ORDER.map(i=>`<option value="${i}" ${dashDay===i?"selected":""}>${DAYS[i]}</option>`).join("");

      body.innerHTML=`
        <div class="page-sub" style="margin:2px 0 12px">${DAYS[dayIdx]} · الساعة ${nowTxt} · ${branchDocs.length} ممارس${branchLabel}</div>
        ${statCardsHTML}
        <div class="toolbar" style="margin:12px 0 4px">
          <select class="select-mini" id="fday">${dayOpts}</select>
          <select class="select-mini" id="fspec"><option value="">كل التخصصات</option>
            ${allSpecs.map(s=>`<option ${dashSpec===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
        </div>
        ${sections}`;
      bindCards(body);
      body.querySelectorAll("[data-stat]").forEach(btn=>btn.onclick=()=>{dashStat=dashStat===btn.dataset.stat?"":btn.dataset.stat;drawBody();});
      $("#fday").onchange=(e)=>{dashDay=e.target.value===-1||e.target.value==="-1"?-1:+e.target.value;dashStat="";drawBody();};
      $("#fspec").onchange=(e)=>{dashSpec=e.target.value;drawBody();};
      const cs=$("#clear-stat"); if(cs)cs.onclick=()=>{dashStat="";drawBody();};
      requestAnimationFrame(()=>body.classList.remove("fade"));
    }
    $("#content").innerHTML=`
      <div class="page-title">ممارسو اليوم</div>
      ${branchBar}
      <div id="dash-body"></div>`;
    $("#branch-bar").querySelectorAll("[data-bf]").forEach(b=>b.onclick=()=>{
      dashBranch=b.dataset.bf;
      $("#branch-bar").querySelectorAll(".bchip").forEach(x=>x.classList.toggle("on",x===b));
      drawBody();
    });
    drawBody();
  };

  // ============================================================ BRANCHES (kept for deep-links, not in nav)

      <div id="branch-docs"></div>`;
    const drawSecs=()=>{
      const wrap=$("#branch-docs"); let html="";
      ordered.forEach(sp=>{
        let arr=bySpec[sp].slice().sort(availSort);
        if(presentOnly) arr=arr.filter(d=>d.live.state==="present");
        if(queryNorm){const tokens=queryNorm.split(/\s+/).filter(Boolean);arr=arr.filter(d=>{const hay=normAr([d.name,d.rank,d.nationality,d.cases].filter(Boolean).join(" "));return tokens.every(t=>hay.includes(t));});}

  routes.doctors=async()=>{
    shell(`<div class="loader"><div class="spin"></div></div>`);
    const [{doctors},{branches}]=await Promise.all([api("/doctors"),api("/branches")]);
    const specs=[...new Set(doctors.map(d=>d.specialty))].filter(Boolean).sort();
    $("#content").innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div><div class="page-title">الممارسون</div><div class="page-sub">${doctors.length} ممارس</div></div>
        <button class="icon-btn" id="go-manage" title="إدارة الممارسين" style="font-size:18px">⚙️</button>
      </div>
      <div class="toolbar" style="margin-top:16px">
        <input class="search-input" id="dsearch" style="max-width:300px;border-radius:var(--r-s);padding:9px 14px" placeholder="ابحث: اسم، تخصص، جنسية، فرع، درجة...">
        <select class="select-mini" id="fspec"><option value="">كل التخصصات</option>${specs.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
        <select class="select-mini" id="fbranch"><option value="">كل الفروع</option>${branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select>
        <select class="select-mini" id="fstatus"><option value="">كل الحالات</option>
          <option value="present">موجود الآن</option><option value="upcoming">يبدأ لاحقاً</option>
          <option value="finished">انتهى دوامه</option><option value="leave">إجازة</option></select>
      </div>
      <div class="status-grid" id="doc-list"></div>`;
    const bname={}; branches.forEach(b=>bname[b.id]=b.name);
    doctors.forEach(d=>d.branch_name=bname[d.branch_id]||"");

    // Fuzzy helper: allow 1-char difference for tokens >= 3 chars
    function fuzzyMatch(t,hay){
      if(hay.includes(t))return true;
      if(t.length<3)return false;
      // try removing each char from token (handles insertions/typos)
      for(let i=0;i<t.length;i++){
        const reduced=t.slice(0,i)+t.slice(i+1);
        if(reduced.length>=2&&hay.includes(reduced))return true;
      }
      return false;
    }

    function scoreDoctor(q,d){
      if(!q)return 1;
      const qNorm=normAr(q);
      const tokens=qNorm.split(/\s+/).filter(t=>t.length>0&&!_STOP.has(t));
      if(!tokens.length)return 1;
      const nameN=normAr(d.name||"");
      const enName=(d.en_name||d.name_en||"").toLowerCase();
      const specN=normAr(d.specialty||""); const rankN=normAr(d.rank||"");
      const natN=normAr(d.nationality||""); const branchN=normAr(bname[d.branch_id]||"");
      const qualN=normAr(d.qualification||""); const genderN=normAr(d.gender||"");
      const expN=normAr(d.experience||""); const casesN=normAr(d.cases||"");
      const coordN=normAr(d.notes_coord||""); const statusN=normAr(d.live?.label||"");
      const hoursN=normAr(d.hours_raw||""); const langN=normAr(d.languages||"");
      let total=0;
      const allFields=nameN+" "+enName+" "+specN+" "+rankN+" "+natN+" "+branchN+" "+qualN+" "+genderN+" "+expN+" "+casesN+" "+coordN+" "+statusN+" "+hoursN+" "+langN;
      for(const t of tokens){
        let s=Math.max(
          scoreNameFn(t,nameN), scoreEnNameFn(t,enName),
          scoreFieldFn(t,specN,10), scoreFieldFn(t,rankN,9),
          scoreFieldFn(t,branchN,8), scoreFieldFn(t,natN,7),
          scoreFieldFn(t,qualN,5), scoreFieldFn(t,genderN,4),
          scoreFieldFn(t,expN,3), scoreFieldFn(t,casesN,2),
          scoreFieldFn(t,coordN,2), scoreFieldFn(t,statusN,6),
          scoreFieldFn(t,hoursN,1), scoreFieldFn(t,langN,3)
        );
        // Fuzzy fallback for typos
        if(!s && fuzzyMatch(t,allFields)) s=50;
        if(!s)return 0;
        total+=s;
      }
      return total;
    }

    let _dsearchTimer;
    const draw=()=>{ const rawQ=$("#dsearch").value.trim(); const sp=$("#fspec").value;
      const br=$("#fbranch").value; const st=$("#fstatus").value;
      // Filter by dropdown first
      let filtered=doctors.filter(d=>
        (!sp||d.specialty===sp)&&(!br||String(d.branch_id)===br)&&(!st||d.live.state===st));
      // Score and sort by search query
      let arr;
      if(rawQ){
        arr=filtered.map(d=>({d,s:scoreDoctor(rawQ,d)}))
          .filter(x=>x.s>0)
          .sort((a,b)=>b.s-a.s||(a.d.name||"").localeCompare(b.d.name||""))
          .map(x=>x.d);
      } else {
        arr=filtered;
      }
      const list=$("#doc-list");
      list.innerHTML=arr.length?arr.map(doctorCard).join(""):`<div class="empty">لا نتائج</div>`;
      bindCards(list);
    };
    // Debounced live search (80ms) + instant filter changes
    const dsInput=$("#dsearch");
    dsInput.addEventListener("input",()=>{clearTimeout(_dsearchTimer);_dsearchTimer=setTimeout(draw,80);});
    ["fspec","fbranch","fstatus"].forEach(id=>{$("#"+id).addEventListener("change",draw);});
    $("#go-manage").onclick=()=>go("control");
    draw();
  };

  async function doctorForm(doc){
    const {branches}=await api("/branches");
    const {specialties}=await api("/specialties");
    const d=doc||{schedule:{},dayoff:[],gender:"",home_visit:false,status:"active"};
    const sc=d.schedule||{};
    const offSet=new Set(d.dayoff||[]);
    const minToTime=(m)=>{m=((m%1440)+1440)%1440;return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;};
    const timeToMin=(t)=>{const[h,mm]=(t||"08:00").split(":").map(Number);return h*60+(mm||0);};
    // convert HH:MM → {h12,min,ap}  and back
    const hhmm2ampm=(t)=>{const[h,m]=(t||"08:00").split(":").map(Number);return{h:h%12||12,m,ap:h<12?"am":"pm"};};
    const ampm2hhmm=(h,m,ap)=>{const h24=ap==="am"?(h===12?0:h):(h===12?12:h+12);return`${String(h24).padStart(2,"0")}:${String(m).padStart(2,"0")}`;};
    const mkTP=(val,id)=>{const{h,m,ap}=hhmm2ampm(val);
      const hrs=Array.from({length:12},(_,i)=>i+1).map(x=>`<option${x===h?" selected":""}>${x}</option>`).join("");
      const mins=[0,5,10,15,20,25,30,35,40,45,50,55].map(x=>`<option value="${x}"${x===m?" selected":""}>${String(x).padStart(2,"0")}</option>`).join("");
      return`<span class="tp" data-tp="${id}"><select class="tp-h tp-s">${hrs}</select><span class="tp-col">:</span><select class="tp-m tp-s">${mins}</select><select class="tp-ap tp-s"><option value="am"${ap==="am"?" selected":""}>ص</option><option value="pm"${ap==="pm"?" selected":""}>م</option></select></span>`;};
    const readTP=(el)=>{const h=+el.querySelector(".tp-h").value,m=+el.querySelector(".tp-m").value,ap=el.querySelector(".tp-ap").value;return ampm2hhmm(h,m,ap);};
    const schedState=WEEK_ORDER.map(day=>{
      const ex=sc[day]||sc[String(day)];
      const isOff=offSet.has(day)||!ex||!ex.length;
      return {day,off:isOff,shifts:ex&&ex.length?ex.map(([s,e])=>({start:minToTime(s),end:minToTime(e)})):[{start:"08:00",end:"16:00"}]};
    });
    const body=`<form id="docf">
      <div class="grid2">
        <div class="field"><label>الاسم *</label><input name="name" value="${esc(d.name||"")}" required></div>
        <div class="field"><label>الفرع *</label><select name="branch_id" required>${branches.map(b=>`<option value="${b.id}" ${d.branch_id==b.id?"selected":""}>${esc(b.name)}</option>`).join("")}</select></div>
        <div class="field"><label>التخصص *</label><input name="specialty" list="speclist" value="${esc(d.specialty||"")}" required>
          <datalist id="speclist">${specialties.map(s=>`<option>${esc(s)}</option>`).join("")}</datalist></div>
        <div class="field"><label>الدرجة / التخصص الدقيق *</label><input name="rank" value="${esc(d.rank||"")}" placeholder="أخصائي، مقيم..." required></div>
        <div class="field"><label>الجنسية *</label><input name="nationality" value="${esc(d.nationality||"")}" required></div>
        <div class="field"><label>الجنس *</label><select name="gender" required>
          <option value="" disabled ${!d.gender?"selected":""}>اختر الجنس</option>
          <option value="ذكر" ${d.gender==="ذكر"?"selected":""}>ذكر</option>
          <option value="أنثى" ${d.gender==="أنثى"?"selected":""}>أنثى</option></select></div>
        <div class="field"><label>سنوات الخبرة *</label><input name="experience" value="${esc(d.experience||"")}" required></div>
        <div class="field"><label>المؤهل</label><input name="qualification" value="${esc(d.qualification||"")}"></div>
        <div class="field"><label>رابط الصورة</label><input name="photo" value="${esc(d.photo||"")}" placeholder="https://..."></div>
        <div class="field"><label>الحالة</label><select name="status">
          <option value="active" ${(d.status||"active")==="active"?"selected":""}>على رأس العمل</option>
          <option value="leave" ${d.status==="leave"?"selected":""}>إجازة</option></select></div>
      </div>
      <div class="field">
        <label>جدول الدوام الأسبوعي</label>
        <div id="sched-grid" class="sched-grid"></div>
      </div>
      <div class="field"><label>الحالات التي يستقبلها</label><textarea name="cases">${esc(d.cases||"")}</textarea></div>
      <div class="field"><label>ملاحظات التنسيق</label><textarea name="notes_coord">${esc(d.notes_coord||"")}</textarea></div>
      <div class="field"><label>ملاحظات إدارية داخلية</label><textarea name="notes_admin">${esc(d.notes_admin||"")}</textarea></div>
    </form>`;
    const foot=`<button class="btn btn-primary" id="save-doc">${doc?"حفظ التعديلات":"إضافة"}</button>
      <button class="btn btn-ghost" data-x2>إلغاء</button>`;
    openModal({title:doc?("تعديل: "+doc.name):"إضافة ممارس",bodyHTML:body,footHTML:foot,wide:true,onMount:(m)=>{
      m.querySelector("[data-x2]").onclick=closeModal;
      function buildSchedUI(container,ss){
        container.innerHTML=ss.map((row,idx)=>`
          <div class="sched-row${row.off?" sched-row-off":""}" data-srow="${idx}">
            <div class="sched-day-lbl">${DAYS[row.day]}</div>
            <div class="sched-shifts-col">${row.off?'<span class="sched-off-tag">إجازة أسبوعية</span>':
              row.shifts.map((sh,si)=>`<div class="shift-pair" data-si="${si}">
                ${mkTP(sh.start,`s-${idx}-${si}`)}
                <span class="sched-sep">–</span>
                ${mkTP(sh.end,`e-${idx}-${si}`)}
                ${row.shifts.length>1?`<button type="button" class="icon-btn sdel" data-del="${si}">✕</button>`:""}</div>`).join("")
              +(!row.off&&row.shifts.length<2?`<button type="button" class="btn btn-ghost btn-xs sadd">＋ شفت ثاني</button>`:"")}</div>
            <button type="button" class="btn btn-ghost btn-xs stoggle">${row.off?"تفعيل":"يوم إجازة"}</button>
          </div>`).join("");
        container.querySelectorAll("[data-srow]").forEach(rowEl=>{
          const idx=+rowEl.dataset.srow,row=ss[idx];
          rowEl.querySelector(".stoggle").onclick=()=>{row.off=!row.off;buildSchedUI(container,ss);};
          if(!row.off){
            const addBtn=rowEl.querySelector(".sadd");
            if(addBtn)addBtn.onclick=()=>{row.shifts.push({start:"08:00",end:"16:00"});buildSchedUI(container,ss);};
            rowEl.querySelectorAll("[data-del]").forEach(btn=>btn.onclick=()=>{row.shifts.splice(+btn.dataset.del,1);buildSchedUI(container,ss);});
          }
        });
      }
      buildSchedUI(m.querySelector("#sched-grid"),schedState);
      m.querySelector("#save-doc").onclick=async()=>{
        const f=new FormData(m.querySelector("#docf"));
        const payload=Object.fromEntries(f.entries());
        payload.branch_id=+payload.branch_id;
        const schedule={},dayoff=[];
        const grid=m.querySelector("#sched-grid");
        schedState.forEach(({day,off,shifts},idx)=>{
          if(off){dayoff.push(day);return;}
          schedule[day]=shifts.map((s,si)=>{
            const startEl=grid.querySelector(`[data-tp="s-${idx}-${si}"]`);
            const endEl=grid.querySelector(`[data-tp="e-${idx}-${si}"]`);
            const st=startEl?readTP(startEl):s.start;
            const en=endEl?readTP(endEl):s.end;
            const sm=timeToMin(st), em=timeToMin(en);
            return [sm, em<sm ? em+1440 : em];
          });
        });
        payload.schedule=schedule; payload.dayoff=dayoff;
        delete payload.hours_raw;
        try{
          if(doc)await api("/doctors/"+doc.id,{method:"PUT",body:payload});
          else await api("/doctors",{method:"POST",body:payload});
          toast(doc?"✅ تم الحفظ":"✅ تمت الإضافة","ok"); closeModal();
          if(state.route==="control") drawDoctorsMgmtPanel(); else render();
        }catch(e){toast("❌ "+e.message,"err");}
      };
    }});

  const LEAVE_TYPES=["إجازة سنوية","إجازة طارئة","إجازة مرضية","ندب","أخرى"];

  async function leaveForm(docId,docName,onDone){
    const {doctors}=await api("/doctors");
    const _n=new Date(),_p=x=>String(x).padStart(2,'0');
    const _today=`${_n.getFullYear()}-${_p(_n.getMonth()+1)}-${_p(_n.getDate())}`;
    const _tom=new Date(_n); _tom.setDate(_tom.getDate()+1);
    const _tomorrow=`${_tom.getFullYear()}-${_p(_tom.getMonth()+1)}-${_p(_tom.getDate())}`;
    const body=`<form id="lvf">
      <div class="field"><label>الممارس *</label><select name="doctor_id" required>
        ${doctors.map(d=>`<option value="${d.id}" ${docId==d.id?"selected":""}>${esc(d.name)} — ${esc(d.specialty)}</option>`).join("")}</select></div>
      <div class="grid2">
        <div class="field"><label>من تاريخ *</label><input type="date" name="start_date" value="${_today}" required></div>
        <div class="field"><label>إلى تاريخ *</label><input type="date" name="end_date" value="${_tomorrow}" required></div>
      </div>
      <div class="field"><label>النوع</label><select name="type">
        ${LEAVE_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
      <div class="field"><label>ملاحظات</label><input name="reason"></div>
    </form>`;
    openModal({title:"إضافة إجازة"+(docName?" — "+docName:""),bodyHTML:body,
      footHTML:`<button class="btn btn-primary" id="save-lv">حفظ</button><button class="btn btn-ghost" data-x3>إلغاء</button>`,
      onMount:(m)=>{ m.querySelector("[data-x3]").onclick=closeModal;
        m.querySelector("#save-lv").onclick=async()=>{
          const f=new FormData(m.querySelector("#lvf")); const p=Object.fromEntries(f.entries());
          if(!p.start_date||!p.end_date){toast("أدخل التواريخ");return;}
          if(p.start_date>p.end_date){toast("❌ تاريخ الانتهاء يجب أن يكون بعد تاريخ البدء","err");return;}
          p.doctor_id=+p.doctor_id;
          try{
            await api("/leaves",{method:"POST",body:p});
            toast("✅ تمت إضافة الإجازة","ok");
            closeModal();
            if(typeof onDone==="function") onDone(); else go(state.route);
          }catch(e){toast("❌ "+e.message,"err");}
        };}});
  }
