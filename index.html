<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0ea5a4">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://www.gstatic.com https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-ancestors 'none';">
<title>مجموعة عادل الطبية | إدارة الممارسين والفروع</title>
<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<!-- iOS / Apple -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عادل الطبية">
<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Adelcare design system ============ */
:root{
  --bg:#f1f5f9; --bg2:#e2e8f0; --surface:#ffffff; --surface2:#f8fafc;
  --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0ea5a4; --brand-d:#0f766e; --brand-soft:#ccfbf1;
  --green:#16a34a; --green-soft:#dcfce7;
  --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2;
  --black:#475569; --black-soft:#e2e8f0;
  --leave:#dc2626; --leave-soft:#fee2e2;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-l:0 10px 30px -10px rgba(15,23,42,.25);
  --r:14px; --r-s:10px;
}
[data-theme="dark"]{
  --bg:#0b1220; --bg2:#0f172a; --surface:#111c30; --surface2:#162338;
  --text:#e8eef7; --muted:#93a4bd; --line:#243349;
  --brand:#2dd4bf; --brand-d:#14b8a6; --brand-soft:#0c3a37;
  --green:#34d399; --green-soft:#0e3a2a;
  --amber:#fbbf24; --amber-soft:#3a2e0c;
  --red:#f87171; --red-soft:#3a1414;
  --black:#94a3b8; --black-soft:#1e293b;
  --leave:#f87171; --leave-soft:#3a1414;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-l:0 14px 40px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- Layout ---------- */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex-shrink:0;background:var(--surface);border-inline-start:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:6px;
  z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand-logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-d));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;box-shadow:var(--shadow)}
.brand-name{font-weight:700;font-size:16px;line-height:1.2}
.brand-sub{font-size:11px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-s);
  color:var(--muted);font-weight:500;transition:.12s;position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-d);font-weight:600}
[data-theme="dark"] .nav-item.active{color:var(--brand)}
.nav-item .ico{width:20px;text-align:center;font-size:17px}
.nav-badge{margin-inline-start:auto;background:var(--green);color:#fff;font-size:11px;
  font-weight:700;padding:1px 8px;border-radius:20px;min-width:22px;text-align:center}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.edit-flag{font-size:12.5px;font-weight:600;text-align:center;padding:7px;border-radius:9px;
  background:var(--green-soft);color:var(--green)}
.spec-chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- User info (sidebar) ---------- */
.user-info{text-align:center;padding:8px 6px;border-radius:var(--r-s);background:var(--surface2)}
.user-info-name{display:block;font-weight:600;font-size:13px}
.user-info-role{display:block;font-size:11px;color:var(--muted)}

/* ---------- Users management ---------- */
.user-grid{display:grid;gap:12px}
.user-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--shadow);transition:border-color .15s}
.user-card:hover{border-color:var(--brand)}
.user-card.user-inactive{opacity:.55}
.user-card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.user-card-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-d));
  color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center;flex-shrink:0}
.user-card-name{font-weight:600;font-size:14px}
.user-badge-super{display:inline-block;font-size:10px;font-weight:700;background:var(--amber-soft);color:var(--amber);
  padding:1px 7px;border-radius:10px;margin-inline-start:6px;vertical-align:middle}
.user-card-meta{font-size:12px;color:var(--muted)}
.user-status-on{color:var(--green);font-weight:600}
.user-status-off{color:var(--red);font-weight:600}
.user-card-perms{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.perm-chip{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--brand-soft);color:var(--brand-d);font-weight:500}
[data-theme="dark"] .perm-chip{color:var(--brand)}
.perm-chip.perm-all{background:var(--amber-soft);color:var(--amber)}
.perm-chip.perm-none{background:var(--bg2);color:var(--muted)}
.user-card-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-pin-eye,.btn-pin-copy{background:none;border:none;cursor:pointer;font-size:13px;padding:1px 3px;opacity:.6;vertical-align:middle}
.btn-pin-eye:hover,.btn-pin-copy:hover{opacity:1}
.pin-masked{font-family:monospace;letter-spacing:1px;vertical-align:middle}
.perms-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.perm-check{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:4px 0}
.perm-check input[type="checkbox"]{width:16px;height:16px;accent-color:var(--brand)}
.perm-select-all{font-weight:600;color:var(--brand-d)}
[data-theme="dark"] .perm-select-all{color:var(--brand)}
.user-card-branches{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.branch-chip{background:var(--green-soft,#e8f5e9);color:var(--green,#388e3c)}
[data-theme="dark"] .branch-chip{color:#66bb6a}

/* ---------- Audit log ---------- */
.audit-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.audit-filters .input{font-size:13px;padding:6px 8px;min-width:0;flex:1}
.audit-cards{display:flex;flex-direction:column;gap:8px}
.audit-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 14px}
.audit-row:hover{border-color:var(--brand)}
.audit-row-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
.audit-user{font-weight:600;font-size:13px;color:var(--text)}
.audit-action{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--brand-soft);color:var(--brand-d);font-weight:500}
[data-theme="dark"] .audit-action{color:var(--brand)}
.audit-branch{font-size:12px;color:var(--green,#388e3c);font-weight:500}
[data-theme="dark"] .audit-branch{color:#66bb6a}
.audit-row-detail{font-size:13px;color:var(--text);margin-bottom:2px}
.audit-row-time{font-size:11px;color:var(--muted)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:12px 22px;padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:14px}
.content{padding:20px 22px 60px;max-width:1280px;width:100%;margin:0 auto}
.page-title{font-size:22px;font-weight:700;margin-bottom:3px}
.page-sub{color:var(--muted);font-size:13px}

/* ---------- Search bar ---------- */
.search-wrap{flex:1;position:relative;max-width:560px}
.search-wrap .ico{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:18px;pointer-events:none}
.search-input{width:100%;padding:11px 44px;border-radius:30px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);transition:.15s;outline:none}
.search-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
/* search-dd: appended to <body> as position:fixed — bypasses every stacking context */
#search-dd{
  position:fixed;
  z-index:9999;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:0 8px 32px -4px rgba(15,23,42,.22);
  overflow-y:scroll;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:6px;
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
  /* max-height set dynamically by positionDD() via visualViewport */
}
.search-hint{display:flex;gap:6px;flex-wrap:wrap;padding:6px}
.chip{background:var(--surface2);border:1px solid var(--line);padding:4px 11px;border-radius:20px;
  font-size:12.5px;color:var(--muted);transition:.12s}
.chip:hover{border-color:var(--brand);color:var(--brand-d)}

.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:.12s}
.icon-btn:hover{border-color:var(--brand);color:var(--brand-d)}

/* ---------- Notifications ---------- */
.notif-wrap{position:relative}
.notif-btn{position:relative}
.notif-badge{position:absolute;top:-5px;inset-inline-end:-5px;background:#e53e3e;color:#fff;
  font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;pointer-events:none;
  border:2px solid var(--surface);animation:badgePop .25s cubic-bezier(.36,.07,.19,.97)}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.notif-btn.ringing svg{animation:bellRing .6s ease}
@keyframes bellRing{
  0%{transform:rotate(0)}
  15%{transform:rotate(18deg)}
  30%{transform:rotate(-16deg)}
  45%{transform:rotate(12deg)}
  60%{transform:rotate(-10deg)}
  75%{transform:rotate(5deg)}
  90%{transform:rotate(-3deg)}
  100%{transform:rotate(0)}
}
.notif-panel{position:fixed;top:56px;inset-inline-end:8px;width:340px;max-width:calc(100vw - 16px);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.14);z-index:3000;overflow:hidden;
  animation:slideDown .15s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;
  border-bottom:1px solid var(--line)}
.notif-head-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.notif-clear{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;padding:2px 6px;border-radius:6px;transition:.12s}
.notif-clear:hover{background:var(--surface2);color:var(--brand)}
.notif-list{max-height:380px;overflow-y:auto}
.notif-empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px}
.notif-empty svg{opacity:.3;width:40px;height:40px}
.notif-footer{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:default;transition:.12s}
.notif-item:last-child{border-bottom:none}
.notif-item.unread{background:var(--brand-soft)}
.notif-item:hover{background:var(--surface2)}
.notif-ico{flex-shrink:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center}
.notif-ico svg{width:18px;height:18px}
.notif-ico.arrived{background:#d1fae5;color:#065f46}
.notif-ico.departed{background:#f1f5f9;color:#475569}
.notif-ico.leave{background:#fef3c7;color:#92400e}
.notif-ico.leave-end{background:#fee2e2;color:#991b1b}
[data-theme="dark"] .notif-ico.arrived{background:#064e3b;color:#6ee7b7}
[data-theme="dark"] .notif-ico.departed{background:#1e293b;color:#94a3b8}
[data-theme="dark"] .notif-ico.leave{background:#451a03;color:#fcd34d}
[data-theme="dark"] .notif-ico.leave-end{background:#450a0a;color:#fca5a5}
.notif-body{flex:1;min-width:0}
.notif-msg{font-size:13px;line-height:1.4;margin-bottom:3px;font-weight:500}
.notif-sub{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.notif-time{font-size:11px;color:var(--muted);opacity:.75}

/* ---------- Topbar date widget ---------- */
.topbar-date{
  display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  padding:4px 12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-s);flex-shrink:0;white-space:nowrap;line-height:1.4;
}
.topbar-date .td-day{font-size:13px;font-weight:700;color:var(--brand)}
.topbar-date .td-hijri,.topbar-date .td-greg{font-size:10.5px;color:var(--muted)}
@media(max-width:700px){
  .topbar-date .td-hijri,.topbar-date .td-greg{display:none}
}
@media(max-width:480px){.topbar-date{display:none}}

/* ---------- Branch bar — uniform grid ---------- */
/* Branch bar — single horizontal scroll row */
.branch-bar{
  display:flex;flex-wrap:nowrap;align-items:flex-start;gap:8px;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  padding:10px 0 12px;margin-bottom:6px;
}
.branch-bar::-webkit-scrollbar{display:none}
/* pill chips (base style) */
.bchip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:9px 16px;border-radius:30px;
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14px;
  transition:.14s;flex-shrink:0;cursor:pointer}
.bchip:hover{border-color:var(--brand);color:var(--brand-d)}
.bchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bchip-n{background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700;
  padding:0 8px;border-radius:20px;min-width:20px;text-align:center;flex-shrink:0}
.bchip.on .bchip-n{background:rgba(255,255,255,.25);color:#fff}
/* branch cards — identical fixed size, no exceptions */
.bchip-branch{
  display:flex!important;
  flex-direction:column!important;
  align-items:flex-start!important;
  justify-content:flex-start!important;
  flex:0 0 172px!important;
  width:172px!important;
  height:86px!important;
  box-sizing:border-box!important;
  padding:9px 11px!important;
  gap:5px!important;
  border-radius:13px!important;
  overflow:hidden!important;
  white-space:normal!important;
}
/* "الكل" compact pill — overrides branch-card rules back to pill shape */
.bchip-all{
  flex:0 0 auto!important;width:auto!important;height:auto!important;
  flex-direction:row!important;align-items:center!important;
  padding:9px 14px!important;gap:7px!important;
  border-radius:30px!important;white-space:nowrap!important;
  overflow:visible!important;
}
.bchip-all .bchip-hours{display:none!important}
/* name row: name truncates with ellipsis, badge stays */
.bchip-branch .bchip-top{
  display:flex!important;flex-direction:row!important;
  align-items:center;gap:5px;
  width:100%;min-width:0;overflow:hidden;
  font-size:12.5px;font-weight:600;line-height:1.3;
  flex-shrink:0;
}
.bchip-name{
  flex:1 1 0;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* hours: 2-line clamp, never expands card */
.bchip-hours{
  font-size:10.5px;font-weight:500;color:var(--muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;width:100%;text-align:start;flex-shrink:0;
}
.bchip-branch.on .bchip-hours{color:rgba(255,255,255,.8)}
/* branch bar: all items top-aligned */
.branch-bar{align-items:flex-start}
@media(max-width:600px){
  .bchip-branch{flex:0 0 154px!important;width:154px!important;height:82px!important;padding:8px 10px!important}
}

/* ---------- Mini stat cards ---------- */
.mini-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px}
.mini-stat{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);border-inline-start:4px solid var(--line)}
.mini-stat .ms-ico{font-size:20px;line-height:1;flex-shrink:0}
.mini-stat .ms-v{font-size:22px;font-weight:700;line-height:1.1}
.mini-stat .ms-l{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.mini-stat.s-green{border-inline-start-color:var(--green)} .mini-stat.s-green .ms-v{color:var(--green)}
.mini-stat.s-amber{border-inline-start-color:var(--amber)} .mini-stat.s-amber .ms-v{color:var(--amber)}
.mini-stat.s-brand{border-inline-start-color:var(--brand)} .mini-stat.s-brand .ms-v{color:var(--brand-d)}
[data-theme="dark"] .mini-stat.s-brand .ms-v{color:var(--brand)}
.mini-stat.s-black{border-inline-start-color:var(--black)} .mini-stat.s-black .ms-v{color:var(--black)}
.mini-stat{cursor:pointer;text-align:start}
.mini-stat:hover{transform:translateY(-1px);box-shadow:var(--shadow-l)}
.mini-stat.active{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.mini-stat.s-green.active{background:var(--green-soft)}
.mini-stat.s-amber.active{background:var(--amber-soft)}
.mini-stat.s-brand.active{background:var(--brand-soft)}
.mini-stat.s-black.active{background:var(--black-soft)}
.chip-clear{background:var(--red-soft);color:var(--red);border:1px solid transparent;border-radius:var(--r-s);
  padding:6px 11px;font-weight:600;font-size:12.5px;transition:.12s}
.chip-clear:hover{filter:brightness(.96)}
@media(max-width:640px){.mini-stats{grid-template-columns:repeat(2,1fr);gap:7px}}
@media(max-width:380px){.mini-stat .ms-ico{display:none}.mini-stat{gap:8px;padding:9px 11px}}
#dash-body{transition:opacity .22s ease}
#dash-body.fade{opacity:0}
.branch-chips{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 4px}
.bchip.ghost{cursor:default;background:var(--surface);color:var(--text)}
.bchip.ghost:hover{border-color:var(--line);color:var(--text)}
.present-toggle{cursor:pointer}
.present-toggle.on{background:var(--green);color:#fff;border-color:var(--green)}
.present-toggle.on .dot{background:#fff!important}
.present-toggle.on .bchip-n{background:rgba(255,255,255,.25);color:#fff}

/* ---------- Stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.15s;cursor:pointer}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-l)}
.stat .v{font-size:30px;font-weight:700;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat .badge{position:absolute;top:14px;inset-inline-start:16px;font-size:22px;opacity:.85}
.stat.s-green{border-inline-start:4px solid var(--green)} .stat.s-green .v{color:var(--green)}
.stat.s-amber{border-inline-start:4px solid var(--amber)} .stat.s-amber .v{color:var(--amber)}
.stat.s-red{border-inline-start:4px solid var(--red)} .stat.s-red .v{color:var(--red)}
.stat.s-brand{border-inline-start:4px solid var(--brand)} .stat.s-brand .v{color:var(--brand-d)}
.stat.s-black{border-inline-start:4px solid var(--black)} .stat.s-black .v{color:var(--black)}
/* compact stats (home dashboard) */
.stats.compact{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:8px}
.stats.compact .stat{padding:9px 13px}
.stats.compact .v{font-size:20px}
.stats.compact .l{font-size:11px;margin-top:0}
.stats.compact .badge{font-size:15px;top:9px}

/* ---------- Section / columns ---------- */
.section-head{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.section-head h2{font-size:15.5px;font-weight:700}
.section-head .count{background:var(--surface2);color:var(--muted);font-size:12px;font-weight:600;
  padding:2px 9px;border-radius:20px;border:1px solid var(--line)}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

/* ---------- Doctor card ---------- */
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;
  box-shadow:var(--shadow);display:flex;gap:11px;transition:.14s;cursor:pointer;position:relative;
  border-inline-start:4px solid var(--line);
  height:120px;overflow:hidden;align-items:flex-start;box-sizing:border-box}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-l);border-inline-start-color:var(--brand)}
.dcard.st-present{border-inline-start-color:var(--green)}
.dcard.st-upcoming{border-inline-start-color:var(--amber)}
.dcard.st-finished{border-inline-start-color:var(--red)}
.dcard.st-leave{border-inline-start-color:var(--leave);background:color-mix(in srgb,var(--leave-soft) 60%,var(--surface))}
.dcard.st-off{border-inline-start-color:var(--black)}
.dcard.st-terminated{border-inline-start-color:#7c3aed;background:color-mix(in srgb,#ede9fe 50%,var(--surface))}
[data-theme="dark"] .dcard.st-terminated{background:color-mix(in srgb,#2e1065 40%,var(--surface))}
.dcard-leave-info span{color:var(--leave)!important;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;display:block;max-width:100%}
.leave-active-row{background:color-mix(in srgb,var(--leave-soft) 80%,var(--surface));border:1px solid var(--leave);
  border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.leave-active-row .la-info{font-size:13px;font-weight:600;color:var(--leave)}
.leave-active-row .la-dates{font-size:12px;color:var(--muted);margin-top:2px}
.leave-active-row .la-actions{display:flex;gap:6px;flex-shrink:0}
.leave-upcoming-row{background:color-mix(in srgb,var(--amber-soft,#fef9ec) 70%,var(--surface));border:1px solid var(--amber);
  border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.leave-upcoming-row .lu-info{font-size:13px;font-weight:600;color:var(--amber)}
.leave-upcoming-row .lu-dates{font-size:12px;color:var(--muted);margin-top:2px}
.leave-upcoming-row .lu-actions{display:flex;gap:6px;flex-shrink:0}
.btn-xs{padding:4px 10px;font-size:12px;border-radius:7px}
.mini-stat.s-leave{border-inline-start-color:var(--leave)} .mini-stat.s-leave .ms-v{color:var(--leave)}
.mini-stat.s-leave.active{background:var(--leave-soft)}
.mini-stat.s-purple{border-inline-start-color:#7c3aed} .mini-stat.s-purple .ms-v{color:#7c3aed}
.mini-stat.s-purple.active{background:#f3e8ff}
[data-theme="dark"] .mini-stat.s-purple .ms-v{color:#a78bfa}
[data-theme="dark"] .mini-stat.s-purple.active{background:#2e1065}
.avatar{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
  font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-d));
  object-fit:cover;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.dcard-body{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.dcard-top{display:flex;justify-content:space-between;align-items:center;gap:6px;overflow:hidden;flex-shrink:0}
.dcard-name{font-weight:700;font-size:15px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard-meta{font-size:12px;color:var(--muted);display:flex;gap:4px;
  flex-wrap:nowrap;overflow:hidden;margin-top:3px;flex-shrink:0}
.dcard-meta span{display:inline-flex;align-items:center;gap:3px;
  white-space:nowrap;overflow:hidden;flex-shrink:0}
.dcard-meta span:last-child{flex-shrink:1;min-width:0;text-overflow:ellipsis;overflow:hidden}
/* Shift / leave info row — wraps to second line if needed, fits in fixed card height */
.dcard-shift{font-size:11px;font-weight:700;color:var(--text);margin-top:3px;
  display:flex;flex-wrap:wrap;gap:1px 3px;line-height:1.35;overflow:hidden;flex-shrink:0;
  max-height:30px}
.dcard-shift span{white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.dcard-shift .shift-seg{color:var(--text)}
.dcard-shift .shift-sep{color:var(--muted);font-weight:400;margin:0 1px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.spec-tag{background:var(--brand-soft);color:var(--brand-d);font-size:12px;font-weight:600;
  padding:1px 8px;border-radius:7px}
[data-theme="dark"] .spec-tag{color:var(--brand)}
.status-pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
.sp-present{background:var(--green-soft);color:var(--green)}
.sp-upcoming{background:var(--amber-soft);color:var(--amber)}
.sp-finished{background:var(--red-soft);color:var(--red)}
.sp-leave{background:var(--leave-soft);color:var(--leave);font-weight:700}
.sp-off{background:var(--black-soft);color:var(--black)}
.sp-secondment{background:#cffafe;color:#0e7490;font-weight:700}
[data-theme="dark"] .sp-secondment{background:#164e63;color:#67e8f9}
.dcard.st-secondment{border-inline-start-color:#06b6d4;background:color-mix(in srgb,#cffafe 40%,var(--surface))}
[data-theme="dark"] .dcard.st-secondment{background:color-mix(in srgb,#164e63 40%,var(--surface))}
.sp-terminated{background:#ede9fe;color:#6d28d9;font-weight:700}
[data-theme="dark"] .sp-terminated{background:#2e1065;color:#c4b5fd}
.sp-in-visit{background:#f3e8ff;color:#7c3aed;font-weight:700}
[data-theme="dark"] .sp-in-visit{background:#2e1065;color:#a78bfa}
.st-in-visit{border-inline-start-color:#7c3aed}
.btn-visit-on{background:#f3e8ff;color:#7c3aed;border:1px solid #7c3aed}
.btn-visit-on:hover{background:#7c3aed;color:#fff}
[data-theme="dark"] .btn-visit-on{background:#2e1065;color:#a78bfa;border-color:#a78bfa}
[data-theme="dark"] .btn-visit-on:hover{background:#7c3aed;color:#fff}
.hv-tag{font-size:10.5px;background:var(--amber-soft);color:var(--amber);padding:1px 7px;border-radius:6px;font-weight:600}

/* ---- Specialties grid (management panel) ---- */
.spec-add-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;margin-bottom:20px;display:flex;flex-direction:column;gap:10px}
.spec-add-card h3{font-size:15px;font-weight:700;margin:0}
.spec-add-row{display:flex;gap:8px;align-items:stretch}
.spec-add-row input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface2);color:var(--text);font-size:14px}
.spec-add-row input:focus{outline:none;border-color:var(--brand)}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.spec-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:.15s;
  border-inline-start:3px solid var(--line)}
.spec-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.spec-card.manual{border-inline-start-color:var(--brand)}
.spec-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.spec-card-name{font-weight:700;font-size:15px;line-height:1.3}
.spec-doc-badge{background:var(--brand-soft);color:var(--brand-d);font-size:11px;font-weight:700;
  padding:2px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.spec-card-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.spec-src-tag{font-size:11px;color:var(--muted);padding:2px 8px;border-radius:6px;
  background:var(--surface2)}
.spec-actions{display:flex;gap:5px;margin-inline-start:auto}

/* ---- Management panel: doctor cards on mobile ---- */
.mgr-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;display:flex;align-items:center;gap:12px;transition:.12s}
.mgr-card:hover{box-shadow:var(--shadow)}
.mgr-card-body{flex:1;min-width:0}
.mgr-card-name{font-weight:700;font-size:14px;margin-bottom:3px}
.mgr-card-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px}
.mgr-card-meta span{display:inline-flex;align-items:center;gap:2px}
.mgr-card-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.mgr-cards{display:flex;flex-direction:column;gap:8px}
.mgr-arch-section{margin-top:20px}
.mgr-arch-section .section-head{cursor:pointer;user-select:none}
.mgr-arch-section .section-head:hover{opacity:.85}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--r-s);
  font-weight:600;font-size:14px;transition:.14s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--brand-d)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand-d)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-block{width:100%;justify-content:center}

/* ---------- Branch cards ---------- */
.branch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
.branch-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);transition:.15s;cursor:pointer}
.branch-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-l)}
.branch-card .bc-top{display:flex;justify-content:space-between;align-items:flex-start}
.bc-icons{display:flex;align-items:center;gap:8px}
.bc-info-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1.5px solid var(--brand);border-radius:50%;cursor:pointer;transition:.15s;color:var(--brand);flex-shrink:0;padding:0}
.bc-info-btn:hover{background:var(--brand);color:#fff}
.bc-info-btn svg{width:15px;height:15px;display:block}
.bchip-info{width:18px;height:18px;padding:0;min-height:0;margin-inline-end:3px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
/* branch details — view mode */
.binfo-view{}
.binfo-fields{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:14px}
.binfo-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.binfo-row:last-child{border-bottom:none}
.bir-lbl{flex:0 0 130px;font-size:12px;color:var(--muted);font-weight:600}
.bir-val{flex:1;font-size:13.5px;line-height:1.5;word-break:break-all}
.bsec-v{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bsec-head-v{background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;letter-spacing:.3px}
.bsec-items-v{padding:0 14px}
.bsec-item-v{padding:9px 0;border-bottom:1px solid var(--line)}
.bsec-item-v:last-child{border-bottom:none}
.biv-name{font-weight:600;font-size:13px;line-height:1.4}
.biv-desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}
/* branch details — edit mode */
.bsec-sep{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--muted);font-size:12.5px;font-weight:700}
.bsec-sep::before,.bsec-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.bsec{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.bsec-head{display:flex;gap:6px;align-items:center;margin-bottom:8px;background:var(--brand);margin:-10px -12px 10px;padding:8px 12px;border-radius:9px 9px 0 0}
.bsec-title{flex:1;font-weight:700;font-size:14px;background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.bsec-title::placeholder{color:rgba(255,255,255,.6)}
.bsec-head .sbtn-del{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.bsec-head .sbtn-del:hover{background:rgba(255,255,255,.3)}
.bsec-item{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.bsec-item .bi-name{flex:1;min-width:0;font-size:13px;resize:vertical}
.bi-pair{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bi-pair .bi-name{border:none;border-bottom:1px solid var(--line);border-radius:0;font-weight:600;font-size:13px;background:var(--surface);padding:6px 8px;resize:none}
.bi-pair .bi-desc{border:none;border-radius:0;font-size:12.5px;color:var(--muted);background:var(--surface2);padding:6px 8px;resize:vertical;min-height:40px}
.branch-card h3{font-size:17px;font-weight:700}
.branch-card .grp{font-size:12px;color:var(--brand-d);font-weight:600}
[data-theme="dark"] .branch-card .grp{color:var(--brand)}
.bc-stat{display:flex;gap:18px;margin-top:14px}
.bc-stat .n{font-size:22px;font-weight:700}
.bc-stat .x{font-size:11.5px;color:var(--muted)}
.bc-live{color:var(--green)}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--surface2);outline:none;transition:.14s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-soft);background:var(--surface)}
.field textarea{resize:vertical;min-height:62px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.day-picker{display:flex;gap:6px;flex-wrap:wrap}
.day-btn{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);
  font-size:13px;font-weight:600;transition:.12s}
.day-btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(8,12,22,.5);
  z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn .18s ease both;will-change:opacity}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.modal-back.closing{animation:fadeOut .15s ease both}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-l);width:100%;max-width:540px;
  animation:pop .2s cubic-bezier(.2,.7,.3,1) both;
  display:flex;flex-direction:column;max-height:88vh;overflow:hidden}
.modal.wide{max-width:760px}
.modal-back.closing .modal{animation:popOut .15s ease both}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
@keyframes popOut{from{transform:none;opacity:1}to{transform:translateY(6px) scale(.99);opacity:0}}
body.modal-open{overflow:hidden}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;background:var(--surface);border-radius:18px 18px 0 0;z-index:2;flex-shrink:0}
.modal-head h3{font-size:17px;font-weight:700}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;flex-shrink:0}

/* Quick doctor card modal */
.qd-head{display:flex;gap:14px;padding:16px 20px;background:linear-gradient(135deg,var(--brand-soft),var(--surface));
  border-bottom:1px solid var(--line)}
.qd-avatar{width:56px;height:56px;border-radius:14px;font-size:22px}
.qd-name{font-size:16px;font-weight:700}
.qd-rows{padding:6px 20px 18px}
.qd-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.qd-row:last-child{border:none}
.qd-row .k{color:var(--muted);min-width:96px;font-weight:600;font-size:13px}
.qd-row .vv{flex:1}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);border:1px solid var(--line)}
.tbl th{background:var(--surface2);text-align:start;padding:11px 14px;font-size:13px;color:var(--muted);font-weight:600}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px}
.tbl tr:hover td{background:var(--surface2)}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar-search{flex:1;max-width:320px;min-width:160px}
.select-mini{padding:8px 12px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow)}

/* ---------- Calendar ---------- */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal-cell{min-height:78px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--surface2);font-size:12px}
.cal-cell .d{font-weight:700;color:var(--muted)}
.cal-cell.today{border-color:var(--brand);background:var(--brand-soft)}
.cal-ev{background:var(--black-soft);color:var(--black);border-radius:6px;padding:1px 5px;margin-top:3px;
  font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;color:var(--muted);font-weight:600;text-align:center}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(1200px 600px at 80% -10%,var(--brand-soft),transparent),var(--bg)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-l);
  width:100%;max-width:400px;padding:34px 30px}
.login-card .brand{justify-content:center;padding-bottom:20px}
.login-roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.role-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.7}

/* ---------- PIN login ---------- */
.pin-card{max-width:340px}
.pin-title{text-align:center;font-weight:600;color:var(--muted);margin:4px 0 10px;font-size:14px}
.pin-input{width:100%;height:58px;text-align:center;font-size:26px;font-weight:700;letter-spacing:10px;
  border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);outline:none;transition:.15s;
  color:var(--text);padding-inline-start:10px}
.pin-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:var(--surface)}
.pin-input::placeholder{letter-spacing:6px;color:var(--muted);font-size:20px}
.pin-display{height:48px;display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;letter-spacing:2px}
.pin-display .pin-dot{font-size:13px;color:var(--brand-d)}
[data-theme="dark"] .pin-display .pin-dot{color:var(--brand)}
.pin-display .pin-empty{color:var(--muted);letter-spacing:4px;font-size:18px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pin-key{height:54px;border-radius:13px;border:1px solid var(--line);background:var(--surface);
